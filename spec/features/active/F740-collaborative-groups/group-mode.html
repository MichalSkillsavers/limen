<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limen · group mode</title>
<style>
	:root { --ink: #1f2328; --muted: #6b7280; --line: #e5e7eb; --blue: #2563eb; --orange: #ea580c; --violet: #7c3aed; --green: #16a34a; }
	* { box-sizing: border-box; }
	body { margin: 0; background: #f6f7f9; color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
	main { max-width: 1120px; margin: 0 auto; padding: 48px 24px 64px; }
	h1 { margin: 0; font-size: 30px; letter-spacing: -0.01em; }
	.sub { margin: 6px 0 32px; color: var(--muted); }
	section { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px 24px; margin-bottom: 20px; }
	h2 { margin: 0 0 14px; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
	svg.g { display: block; width: 100%; height: auto; }
	svg.g text { font-family: inherit; text-anchor: middle; dominant-baseline: central; font-size: 14px; font-weight: 600; }
	svg.g line, svg.g path { fill: none; stroke-width: 1.75; }
	svg.g rect { stroke-width: 1.5; }
	.note { font-size: 12px; font-weight: 500; fill: var(--muted); }
	.lane { font-size: 13px; font-weight: 700; text-anchor: start !important; }
	.you rect { fill: #fff; stroke: var(--ink); }
	.lead rect { fill: var(--ink); stroke: var(--ink); } .lead text { fill: #fff; }
	.t1 rect { fill: #eaf1ff; stroke: var(--blue); } .t1 text { fill: #1e40af; }
	.t2 rect { fill: #fff1e6; stroke: var(--orange); } .t2 text { fill: #9a3412; }
	.sh rect { fill: #f3edff; stroke: var(--violet); } .sh text { fill: #5b21b6; }
	.ok rect { fill: #eafaf0; stroke: var(--green); } .ok text { fill: #166534; }
	.wk rect { fill: #fff; stroke: #cbd5e1; } .wk text { font-size: 13px; font-weight: 500; }
	.end rect { fill: #f3f4f6; stroke: #9ca3af; } .end text { fill: #374151; }
	.a { stroke: var(--ink); marker-end: url(#m-ink); }
	.ab { stroke: var(--blue); marker-end: url(#m-blue); }
	.ao { stroke: var(--orange); marker-end: url(#m-orange); }
	.av { stroke: var(--violet); marker-end: url(#m-violet); }
	.both { stroke: var(--violet); stroke-dasharray: 5 4; marker-start: url(#m-violet); marker-end: url(#m-violet); }
	.dash { stroke-dasharray: 5 4; }
	.sep { stroke: var(--line); stroke-width: 1 !important; }
	.step circle { fill: #fff; stroke: #d1d5db; } .step text { font-size: 12px; fill: var(--muted); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
	<defs>
		<marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker>
		<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
		<marker id="m-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker>
		<marker id="m-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
	</defs>
</svg>
<main>
	<h1>Limen · group mode</h1>
	<p class="sub">One feature · several teams · different approaches · shared findings</p>

	<section>
		<h2>1 · Idea</h2>
		<svg class="g" viewBox="0 0 960 360" role="img" aria-label="You talk to the lead. The lead starts two teams on the same ticket. Teams share findings; the lead gets updates and alone merges.">
			<line class="a" x1="480" y1="54" x2="480" y2="92"/>
			<line class="a" x1="440" y1="146" x2="250" y2="192"/>
			<line class="a" x1="520" y1="146" x2="710" y2="192"/>
			<line class="av dash" x1="480" y1="196" x2="480" y2="150"/>
			<line class="both" x1="344" y1="221" x2="398" y2="221"/>
			<line class="both" x1="562" y1="221" x2="616" y2="221"/>
			<line class="ab" x1="206" y1="246" x2="172" y2="286"/>
			<line class="ab" x1="246" y1="246" x2="280" y2="286"/>
			<line class="ao" x1="714" y1="246" x2="680" y2="286"/>
			<line class="ao" x1="754" y1="246" x2="788" y2="286"/>

			<text class="note" x="322" y="156">same ticket</text>
			<text class="note" x="638" y="156">same ticket</text>
			<text class="note" x="490" y="172" style="text-anchor:start;fill:#7c3aed">updates</text>
			<text class="note" x="582" y="121" style="text-anchor:start">only one who merges</text>

			<g class="you"><rect x="420" y="12" width="120" height="42" rx="21"/><text x="480" y="33">You</text></g>
			<g class="lead"><rect x="390" y="96" width="180" height="50" rx="10"/><text x="480" y="121">Lead</text></g>
			<g class="t1"><rect x="110" y="196" width="232" height="50" rx="10"/><text x="226" y="221">Team 1 · approach A</text></g>
			<g class="sh"><rect x="400" y="196" width="160" height="50" rx="25"/><text x="480" y="221">Findings</text></g>
			<g class="t2"><rect x="618" y="196" width="232" height="50" rx="10"/><text x="734" y="221">Team 2 · approach B</text></g>
			<g class="wk"><rect x="116" y="290" width="100" height="38" rx="8"/><text x="166" y="309">Worker</text></g>
			<g class="wk"><rect x="236" y="290" width="100" height="38" rx="8"/><text x="286" y="309">Worker</text></g>
			<g class="wk"><rect x="624" y="290" width="100" height="38" rx="8"/><text x="674" y="309">Worker</text></g>
			<g class="wk"><rect x="744" y="290" width="100" height="38" rx="8"/><text x="794" y="309">Worker</text></g>
			<text class="note" x="226" y="346">own branches</text>
			<text class="note" x="734" y="346">own branches</text>
		</svg>
	</section>

	<section>
		<h2>2 · Example workflow</h2>
		<svg class="g" viewBox="0 0 1100 372" role="img" aria-label="Lead starts the group. Both teams post ideas first, then build. Team 1 finds an edge case; Team 2 adds a test and replies; both candidates pass; the lead compares.">
			<rect x="0" y="200" width="1100" height="80" fill="#faf7ff" stroke="none"/>
			<line class="sep" x1="0" y1="40" x2="1100" y2="40"/>
			<line class="sep" x1="0" y1="120" x2="1100" y2="120"/>
			<line class="sep" x1="0" y1="200" x2="1100" y2="200"/>
			<line class="sep" x1="0" y1="280" x2="1100" y2="280"/>
			<line class="sep" x1="0" y1="360" x2="1100" y2="360"/>
			<text class="lane" x="12" y="80" fill="#1f2328">Lead</text>
			<text class="lane" x="12" y="160" fill="#2563eb">Team 1</text>
			<text class="lane" x="12" y="240" fill="#7c3aed">Findings</text>
			<text class="lane" x="12" y="320" fill="#ea580c">Team 2</text>

			<g class="step"><circle cx="180" cy="20" r="11"/><text x="180" y="20">1</text></g>
			<g class="step"><circle cx="320" cy="20" r="11"/><text x="320" y="20">2</text></g>
			<g class="step"><circle cx="460" cy="20" r="11"/><text x="460" y="20">3</text></g>
			<g class="step"><circle cx="600" cy="20" r="11"/><text x="600" y="20">4</text></g>
			<g class="step"><circle cx="740" cy="20" r="11"/><text x="740" y="20">5</text></g>
			<g class="step"><circle cx="880" cy="20" r="11"/><text x="880" y="20">6</text></g>
			<g class="step"><circle cx="1020" cy="20" r="11"/><text x="1020" y="20">7</text></g>

			<path class="a" d="M180 100 C180 150 220 160 263 160"/>
			<path class="a" d="M180 100 C180 300 220 320 263 320"/>
			<line class="av" x1="320" y1="180" x2="320" y2="221"/>
			<line class="av" x1="320" y1="300" x2="320" y2="259"/>
			<line class="ab" x1="375" y1="160" x2="403" y2="160"/>
			<line class="ao" x1="375" y1="320" x2="403" y2="320"/>
			<line class="ab" x1="515" y1="160" x2="543" y2="160"/>
			<line class="ao" x1="515" y1="320" x2="683" y2="320"/>
			<line class="av" x1="600" y1="180" x2="600" y2="221"/>
			<path class="av" d="M648 240 C672 240 694 268 705 298"/>
			<line class="av" x1="760" y1="300" x2="760" y2="259"/>
			<path class="av" d="M788 240 C818 240 842 216 852 182"/>
			<line class="ab" x1="655" y1="160" x2="823" y2="160"/>
			<line class="ao" x1="795" y1="320" x2="823" y2="320"/>
			<path class="a" d="M935 160 C962 160 984 140 990 102"/>
			<path class="a" d="M935 320 C1000 320 1030 220 1030 102"/>

			<g class="lead"><rect x="125" y="60" width="110" height="40" rx="8"/><text x="180" y="80">group start</text></g>
			<g class="t1"><rect x="265" y="140" width="110" height="40" rx="8"/><text x="320" y="160">idea: map</text></g>
			<g class="sh"><rect x="272" y="223" width="96" height="34" rx="17"/><text x="320" y="240">ideas</text></g>
			<g class="t2"><rect x="265" y="300" width="110" height="40" rx="8"/><text x="320" y="320">idea: sort</text></g>
			<g class="t1"><rect x="405" y="140" width="110" height="40" rx="8"/><text x="460" y="160">build</text></g>
			<g class="t2"><rect x="405" y="300" width="110" height="40" rx="8"/><text x="460" y="320">build</text></g>
			<g class="t1"><rect x="545" y="140" width="110" height="40" rx="8"/><text x="600" y="160">edge case</text></g>
			<g class="sh"><rect x="552" y="223" width="96" height="34" rx="17"/><text x="600" y="240">finding</text></g>
			<g class="t2"><rect x="685" y="300" width="110" height="40" rx="8"/><text x="740" y="320">adds test</text></g>
			<g class="sh"><rect x="692" y="223" width="96" height="34" rx="17"/><text x="740" y="240">reply</text></g>
			<g class="t1"><rect x="825" y="140" width="110" height="40" rx="8"/><text x="880" y="160">candidate ✓</text></g>
			<g class="t2"><rect x="825" y="300" width="110" height="40" rx="8"/><text x="880" y="320">candidate ✓</text></g>
			<g class="lead"><rect x="965" y="60" width="110" height="40" rx="8"/><text x="1020" y="80">compare</text></g>
		</svg>
	</section>

	<section>
		<h2>3 · Outcome</h2>
		<svg class="g" viewBox="0 0 960 250" role="img" aria-label="Two tested branches and the shared findings feed one synthesis; the lead merges the best or combined result, then stops and closes the group.">
			<path class="a" d="M250 40 C300 40 296 112 338 112"/>
			<line class="av" x1="250" y1="124" x2="338" y2="124"/>
			<path class="a" d="M250 208 C300 208 296 136 338 136"/>
			<line class="a" x1="530" y1="124" x2="608" y2="124"/>
			<line class="a" x1="760" y1="124" x2="808" y2="124"/>

			<g class="t1"><rect x="20" y="16" width="230" height="48" rx="10"/><text x="135" y="40">Branch A · tests ✓</text></g>
			<g class="sh"><rect x="20" y="100" width="230" height="48" rx="24"/><text x="135" y="124">Findings</text></g>
			<g class="t2"><rect x="20" y="184" width="230" height="48" rx="10"/><text x="135" y="208">Branch B · tests ✓</text></g>
			<g class="lead"><rect x="340" y="94" width="190" height="60" rx="10"/><text x="435" y="124">Synthesis</text></g>
			<g class="ok"><rect x="610" y="94" width="150" height="60" rx="10"/><text x="685" y="124">Merge</text></g>
			<g class="end"><rect x="810" y="94" width="130" height="60" rx="10"/><text x="875" y="124">Stop → Close</text></g>
			<text class="note" x="435" y="172">best or combined</text>
			<text class="note" x="685" y="172">lead only</text>
		</svg>
	</section>
</main>
</body>
</html>
