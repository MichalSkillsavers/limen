<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limen · Picture · plant and decisions</title>
<style>
:root{
  --paper:#f5f4ef; --sheet:#fbfaf6; --card:#fff; --ink:#1c1e22; --ink2:#41464e; --mute:#686d75; --faint:#8b9098;
  --line:#d9d7cf; --line2:#e8e6df; --wire:#a3a7ad;
  --red:#b42318; --red-bg:#fdf0ee; --red-line:#f0c4bd;
  --indigo:#3538cd; --indigo-bg:#f0f0fd; --indigo-line:#c9cbf5;
  --amber:#a15c07; --amber-bg:#fdf4e6;
  --teal:#0d6b62; --teal-bg:#e2f0ed; --teal-line:#8cc4bb;
  --head:72px; --gap:24px;
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:var(--paper); font-size:15px; line-height:1.5;
}
*{box-sizing:border-box}
body{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
code,.path{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}

/* Masthead with sticky pins */
.mast{position:sticky;top:0;z-index:20;height:var(--head);background:var(--paper);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:230px repeat(3,minmax(0,1fr));gap:12px;align-items:center;padding:0 var(--gap)}
.brand{text-decoration:none;display:block;min-width:0}
.brand b{font-size:19px;letter-spacing:-.02em}
.brand span{display:block;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ink);
  border-radius:7px;padding:7px 12px 8px;min-width:0}
.pin .lab{font-size:12px;font-weight:650;letter-spacing:.01em}
.pin .lab small{font-weight:500;color:var(--mute);font-size:12px}
.pin .txt{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin.wrong{border-left-color:var(--red)} .pin.wrong .lab,.pin.wrong .txt{color:var(--red)}
.pin.needs{border-left-color:var(--indigo)} .pin.needs .lab,.pin.needs .txt{color:var(--indigo)}
.pin:hover{border-color:var(--ink2)}
.pin[aria-current="true"]{background:#fff;box-shadow:0 0 0 2px var(--ink) inset}
.pin.wrong[aria-current="true"]{background:var(--red-bg);box-shadow:0 0 0 2px var(--red) inset}
.pin.needs[aria-current="true"]{background:var(--indigo-bg);box-shadow:0 0 0 2px var(--indigo) inset}

/* Two areas: plant atlas and reading column */
.main{display:grid;grid-template-columns:minmax(0,1fr) 470px;gap:var(--gap);padding:16px var(--gap) 64px;align-items:start}
.atlas{position:sticky;top:calc(var(--head) + 16px);height:calc(100vh - var(--head) - 32px);min-height:600px;
  background:var(--sheet);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;padding:16px 20px 12px;overflow:auto}
.eyebrow{font-size:11.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.atlas-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.atlas h1{font-size:21px;letter-spacing:-.02em;margin:1px 0 1px;line-height:1.25}
.atlas h1 a{text-decoration:none}
.atlas h1 a:hover{text-decoration:underline}
.atlas .gloss{margin:0;color:var(--ink2);font-size:14px;max-width:62ch}
.atlas .facts{font-size:12px;color:var(--mute);text-align:right;white-space:nowrap;padding-top:2px}
.lightline{margin:10px 0 0;min-height:36px;display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:7px;
  background:#efeee8;font-size:13.5px;color:var(--ink2)}
.lightline b{color:var(--ink)}
.lightline>span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lightline .sw{width:10px;height:10px;border-radius:3px;flex:none;background:var(--wire)}
.lightline.on{background:var(--teal-bg);color:var(--ink)} .lightline.on .sw{background:var(--teal)}
.lightline.focus .sw{background:var(--ink)}
.lightline a{margin-left:auto;white-space:nowrap;font-size:13px}
.stage{position:relative;flex:1;display:grid;grid-template-rows:auto auto auto;row-gap:44px;align-content:center;padding:14px 2px 10px}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.stage svg.base{z-index:0} .stage svg.over{z-index:1}
.band,.mod{position:relative;background:var(--card);border:1px solid var(--line);border-radius:9px}
.midrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;position:relative}
.mod{padding:10px 9px 10px 14px;display:flex;flex-direction:column;gap:4px}
.mod-head a{font-size:14px;font-weight:650;text-decoration:none}
.mod-head a:hover{text-decoration:underline}
.mod p{margin:0 0 4px;font-size:11.5px;line-height:1.4;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mod .places{display:grid;gap:5px}
.mod.floor{flex-direction:row;align-items:center;gap:16px;padding:10px 12px}
.mod.floor .fhead{width:230px;flex:none}
.mod.floor p{margin:0}
.mod.floor .places{flex:1;grid-template-columns:1fr 1fr;gap:8px}
.band{display:block;padding:0;border:none;background:none}
.place{position:relative;z-index:2;display:flex;align-items:center;gap:6px;text-decoration:none;font-size:12px;line-height:1.3;
  padding:5px 7px;border:1px solid var(--line2);border-radius:6px;background:#fff;transition:opacity .15s,background .15s,border-color .15s}
.place .nm{flex:1;min-width:0}
.place .ct{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.place .pd{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
.place:hover{border-color:var(--ink2)}
.band .place{padding:10px 14px;border:1px solid var(--line);border-radius:9px;font-size:13px}
.band .place .nm b{font-size:14px}
.band .place .nm span{color:var(--mute);margin-left:8px}
.lens .place{opacity:.42}
.lens .place.lit,.lens .place.focus,.lens .place.near,.lens .place.hov{opacity:1}
.place.lit{background:var(--teal-bg);border-color:var(--teal);color:#08443e;font-weight:600}
.place.lit .ct{color:var(--teal)}
.place.near{border-color:var(--ink2);border-style:dashed}
.place.focus{box-shadow:0 0 0 2px var(--ink);border-color:var(--ink);opacity:1}
.place.hov{box-shadow:0 0 0 2px var(--teal);opacity:1}
.atlas.preview .place.pv{background:var(--teal-bg);border-color:var(--teal-line);opacity:1}
.atlas.preview .place:not(.pv):not(.lit):not(.focus){opacity:.42}
.mod.mfocus,.band.mfocus .place{box-shadow:0 0 0 2px var(--ink)}
.badge{position:absolute;left:-7px;top:-9px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--teal);color:#fff;
  font-size:10.5px;font-weight:700;line-height:18px;text-align:center;z-index:4;pointer-events:none}
.badge.cur{background:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--mute);border-top:1px solid var(--line2);padding-top:10px;margin-top:6px}
.legend i{display:inline-block;vertical-align:-1px;margin-right:6px}
.legend .k-lit{width:12px;height:12px;border-radius:3px;background:var(--teal-bg);border:1px solid var(--teal)}
.legend .k-focus{width:12px;height:12px;border-radius:3px;border:2px solid var(--ink)}
.legend .k-pd{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.legend .k-n{font-style:normal;font-size:10.5px;color:var(--faint)}
.legend .k-wire{width:20px;height:0;border-top:1.5px solid var(--wire);vertical-align:3px}
.wire{fill:none;stroke:var(--wire);stroke-width:1.4}
.wcount{fill:#fff;stroke:var(--line)} .wnum{font-size:10.5px;fill:var(--mute);font-weight:600;text-anchor:middle;dominant-baseline:central}
.wire.sel{stroke:var(--teal);stroke-width:1.8;opacity:.85}
.wire.ink{stroke:var(--ink);stroke-width:1.6;opacity:.8}
.wire.hot{stroke-width:3;opacity:1}

/* Reading column */
.read{min-width:0;padding-bottom:60vh} /* room to scroll, so a row stays put when the entry under it closes */
.crumbs{position:sticky;top:var(--head);z-index:10;background:var(--paper);padding:10px 0 9px;border-bottom:1px solid var(--line);
  display:flex;gap:10px;align-items:baseline;font-size:13px}
.crumbs .trail{flex:1;min-width:0;color:var(--mute)}
.crumbs .trail a{color:var(--ink);text-underline-offset:2px}
.crumbs .trail b{color:var(--ink);font-weight:650}
.crumbs .trail .sep{margin:0 5px;color:var(--faint)}
.crumbs .lbl{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-right:6px}
.crumbs .up{white-space:nowrap;text-decoration:none;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 9px}
.crumbs .up:hover{border-color:var(--ink2)}
.tools{display:flex;gap:12px;align-items:center;margin:14px 0 6px}
.tabs{display:flex;gap:2px;background:#ebe9e2;border-radius:8px;padding:3px}
.tabs a{text-decoration:none;font-size:13.5px;padding:5px 11px;border-radius:6px;color:var(--ink2);white-space:nowrap}
.tabs a small{color:var(--faint);margin-left:4px}
.tabs a[aria-current="page"]{background:var(--card);color:var(--ink);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.filter{flex:1;min-width:0;font:inherit;font-size:13.5px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.hint{font-size:13px;color:var(--mute);margin:8px 0 2px}
.sec{margin-top:18px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.sec-h h2{margin:0;font-size:15px;letter-spacing:-.01em}
.sec-h h2 small{color:var(--faint);font-weight:500;margin-left:6px;font-size:13px}
.sec-h span{font-size:12.5px;color:var(--mute)}
.entry{border-bottom:1px solid var(--line2)}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) 18px;gap:10px;text-decoration:none;padding:12px 6px 12px 4px;border-left:3px solid transparent}
.row:hover{background:#faf9f4}
.row .kind{font-size:12px;color:var(--mute);padding-top:2px}
.row .t{font-weight:650;font-size:15px;line-height:1.35}
.row .pp{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.row .meta{display:block;color:var(--faint);font-size:12.5px;margin-top:3px}
.row .ch{color:var(--faint);font-size:14px;padding-top:1px;text-align:right}
.row.hint-on{border-left-color:var(--teal)}
.row.sub{padding-left:22px;grid-template-columns:44px minmax(0,1fr) 18px}
.tag{display:inline-block;font-size:11px;font-weight:650;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.tag.needs{color:var(--indigo);background:var(--indigo-bg)}
.tag.wrong{color:var(--red);background:var(--red-bg)}
.tag.changed{color:var(--ink);background:#e9e8e2}
.tag.partial{color:var(--amber);background:var(--amber-bg)}
.entry.open{background:var(--card);border:1px solid var(--line);border-radius:9px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.entry.open>.row{border-left-color:var(--ink);border-radius:9px 9px 0 0}
.entry.open>.row .ch{color:var(--ink)}
.mid{padding:2px 20px 18px 20px}
.lead{font-size:15px;margin:2px 0 12px;padding:10px 12px;background:#f7f6f1;border-radius:7px}
.lead b{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:1px}
.box{border-radius:8px;padding:11px 13px;margin:0 0 12px;font-size:14.5px}
.box b.k{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.box.wrong{background:var(--red-bg);border:1px solid var(--red-line);color:#7a1a10} .box.wrong b.k{color:var(--red)}
.box.needs{background:var(--indigo-bg);border:1px solid var(--indigo-line);color:#24268f} .box.needs b.k{color:var(--indigo)}
.box.needs .ask{font-weight:650;font-size:15.5px;margin:0 0 6px}
.box.needs ol{margin:0;padding-left:20px} .box.needs li{margin:3px 0}
.blk{border-top:1px solid var(--line2);padding-top:10px;margin-top:12px}
.blk h4{margin:0 0 5px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.blk h4 small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);margin-left:6px;font-size:12px}
.blk p{margin:0 0 6px;font-size:14.5px}
.note,.blk p.note{font-size:12.5px;color:var(--mute);margin:0 0 6px}
.blk p.path,.deep p.path{font-size:12px;word-break:break-all}
.plist{display:grid;gap:6px}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-decoration:none;padding:7px 10px;border:1px solid var(--line2);border-radius:7px;background:#fff}
.pl:hover{border-color:var(--ink2);background:#faf9f4}
.pl b{font-size:14px;font-weight:600}
.pl span{grid-column:1;font-size:13px;color:var(--mute);line-height:1.4}
.pl em{grid-column:2;grid-row:1;font-style:normal;font-size:12px;color:var(--faint);white-space:nowrap}
.pl.cur{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pl.lit b{color:var(--teal)}
.elist{display:grid;gap:4px;font-size:13.5px}
.erow{display:block;padding:5px 8px;border-radius:6px;line-height:1.45}
.erow:hover{background:#f3f2ec}
.erow .rel{color:var(--mute);font-size:12.5px;margin:0 4px}
.erow small{display:block;color:var(--mute);font-size:12.5px}
.evl{display:flex;justify-content:space-between;gap:12px;text-decoration:none;padding:8px 10px;border:1px solid var(--line2);border-radius:7px;margin-bottom:6px;background:#fff}
.evl:hover{border-color:var(--ink2)}
.evl b{font-size:14px;font-weight:600}
.evl span{display:block;font-size:13px;color:var(--mute)}
.evl i{font-style:normal;font-size:12.5px;color:var(--ink2);white-space:nowrap;padding-top:1px}
.evl[aria-expanded="true"]{border-color:var(--ink)}
.deep{margin:4px 0 12px;padding:12px 14px 14px;background:#f8f7f2;border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:8px}
.deep .back{display:inline-block;font-size:13px;font-weight:600;margin-bottom:8px}
.deep h3{margin:2px 0 6px;font-size:17px;letter-spacing:-.01em}
.deep .excerpt{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:8px 0;font-size:14.5px;color:var(--ink2)}
.deep .stop{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.steps a{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;text-decoration:none;padding:6px 8px;border-radius:7px;border:1px solid transparent}
.steps a:hover{background:#f6f5f0}
.steps a[aria-current="step"]{border-color:var(--ink);background:#fff}
.steps .n{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.steps a[aria-current="step"] .n{background:var(--ink)}
.steps b{font-size:14px;font-weight:600;display:block}
.steps span{font-size:13.5px;color:var(--ink2)}
.ditem{display:block;text-decoration:none;padding:8px 10px;border:1px solid var(--line2);border-radius:7px;margin-bottom:6px;background:#fff}
.ditem:hover{border-color:var(--ink2)}
.ditem b{font-size:14px}
.ditem span{display:block;font-size:13.5px;color:var(--ink2)}
.ditem span.tag{display:inline-block;font-size:11px}
.inl{display:flex;flex-wrap:wrap;gap:6px}
.inl a{font-size:13px;text-decoration:none;border:1px solid var(--line2);background:#fff;border-radius:5px;padding:2px 8px}
.inl a:hover{border-color:var(--ink2)}
.empty{color:var(--mute);font-size:14px;padding:16px 4px}
.foot{font-size:12px;color:var(--faint);margin-top:28px}

@media (max-width:1240px){ /* the plant needs its width: stack it above the column */
  .main{grid-template-columns:1fr}
  .atlas{position:static;height:auto;min-height:0}
  .brand{display:none}
  .mast{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){
  .mast{grid-template-columns:1fr;height:auto;padding:10px 16px;gap:6px;position:static}
  .main{padding:14px 16px 48px}
  .midrow{grid-template-columns:1fr 1fr}
  .crumbs{top:0}
}
</style>
</head>
<body>
<header class="mast" id="mast"></header>
<main class="main">
  <section class="atlas" id="atlas" aria-label="Plant architecture">
    <div class="atlas-head">
      <div>
        <div class="eyebrow">Plant · architecture</div>
        <h1><a href="#plant" id="plantLink"></a></h1>
        <p class="gloss" id="plantGloss"></p>
      </div>
      <div class="facts" id="facts"></div>
    </div>
    <div class="lightline" id="lightline" role="status"></div>
    <div class="stage" id="stage">
      <svg class="base" id="base" aria-hidden="true"></svg>
      <svg class="over" id="over" aria-hidden="true"></svg>
    </div>
    <div class="legend">
      <span><i class="k-wire"></i>module connection · number = place-level links</span>
      <span><i class="k-lit"></i>lit by the selected work or journey</span>
      <span><i class="k-focus"></i>place you opened</span>
      <span><i class="k-pd"></i>partial in the map</span>
      <span><i class="k-n">3</i>work items that touch the place</span>
    </div>
  </section>
  <section class="read" id="read" aria-label="Work, journeys, days, and places"></section>
</main>
<script id="data" type="application/json">{"plant":{"id":"limen.plant","title":"Limen coding-job plant","gloss":"Limen runs isolated coding jobs for one human and several agent sessions.","body":["Limen runs isolated coding jobs for one human and several agent sessions.","The coordinator owns judgment; ordinary files and Git own durable intent and job evidence.","Operator commands create worktrees and job records, then hand execution to detached wrappers or hosted supervisors.","Session hooks carry guidance, deliver steering, and return completion evidence to coordinators.","Optional integrations expose jobs through Herdr, GitHub, and finish notifications.","The picture pipeline reads a separate local dataset and renders an offline map."],"gaps":["This map describes the named source revision, not the current deployment or newly exercised worker behavior.","Feature records name source-backed capabilities; journey records show ordered actions through the places that implement them.","These overlays describe architecture, not live feature state or deployment proof.","Collaborative groups remain outside this revision; the board records unlanded candidate work, not an implemented group boundary.","The extension loader mentions optional group-peer, but this checkout supplies no group-peer hook or group command.","Hosted OMP recovery lacks an OMP foreground-process fallback when Herdr loses agent classification.","The GitHub doorbell has one-seat evidence; routing between two owning seats remains unproved.","Linux process identity exists in code; the operator guide still describes missing Linux parity.","This pass does not resolve that documentation mismatch or establish Linux operational parity."],"revision":"1cecf60","date":"3 Oct"},"modules":[{"id":"limen.commands","title":"Operator commands","gloss":"Operator commands start, inspect, steer, land, and retire jobs.","body":["The CLI owns explicit operator actions, from initialization and launch through inspection, steering, stopping, landing, and retention.","Spawn resolves repository boundaries, engine choice, role preambles, and hosted versus detached execution.","Continuation creates a new record and seeds its transcript from the finished parent's recorded engine session.","Status joins job files, Git evidence, and Herdr observations; a clean termination yields a candidate to inspect.","Land merges a done job's committed branch into the clean, currently checked-out target after explicit confirmation.","Prune removes unused worktrees; retirement removes finished records only when their branches are landed or gone.","Init writes missing furniture without replacing existing project prose.","The Linear command toggles a Markdown configuration; agents own mirroring, not this CLI."],"status":"ready","layer":"entry","places":["limen.commands"],"sources":["bin/limen","src/main.ts","src/commands/spawn.ts","src/commands/continue.ts","src/commands/steer.ts","src/commands/stop.ts","src/commands/status.ts","src/commands/land.ts","src/commands/prune.ts","src/commands/init.ts","src/commands/linear.ts"]},{"id":"limen.picture","title":"Architecture map","gloss":"A local Markdown dataset becomes one offline map.","body":["Each plant owns a gitignored Markdown dataset separate from specifications and job state.","Build renders that dataset deterministically into one offline HTML file without calling a model.","Tick compares the plant revision with Git HEAD and requests a detached picture refresh only for relevant code changes.","An opt-in repository hook starts tick when the configured top branch moves; it replaces operator-scheduled picture timers.","The picture neither gates job launch nor merges or commits its artifacts.","Feature touches and ordered journey steps annotate places without creating containment or edges."],"status":"ready","layer":"mid","places":["limen.picture.build","limen.picture.viewer","limen.picture.tick","limen.picture.watch"],"sources":["src/commands/picture.ts","src/picture/picture-build.ts","src/project/picture-tick.ts","src/project/picture-watch.ts","templates/picture/CONTRACT.md","spec/features/done/2026-10/F743-living-architecture-picture/ticket.md"]},{"id":"limen.runtime","title":"Worker execution","gloss":"Wrappers and supervisors own the engine processes.","body":["Detached wrappers own background engine processes; hosted supervisors follow engines inside Herdr panes.","Both execution paths publish evidence into the same job record and use the same terminal-state layer.","The engine profile selects Pi or OMP without giving either ownership of the board or landing decisions.","Runtime liveness distinguishes observed ownership, missing processes, and uncertain probes."],"status":"ready","layer":"mid","places":["limen.runtime.detached","limen.runtime.hosted","limen.runtime.engine","limen.runtime.liveness"],"sources":["src/runtime/wrapper.ts","src/runtime/supervisor.ts","src/runtime/engine.ts","src/runtime/reap.ts"]},{"id":"limen.sessions","title":"Agent session hooks","gloss":"Hooks carry guidance, steering, and wakes into sessions.","body":["Hooks attach Limen behavior to engine sessions without owning candidate work or merging it.","The project extension stub loads package hooks; worker launchers select the hooks appropriate to their execution mode.","Guidance lives in prose; hooks inject it, recall it, and deliver file-backed messages.","Coordinator hooks observe jobs, while worker hooks report activity and accept steering."],"status":"ready","layer":"mid","places":["limen.sessions.wake","limen.sessions.guidance","limen.sessions.worker"],"sources":["templates/limen-extension.ts","hook/communication.ts","hook/wake.ts","hook/steering.ts","hook/hosted.ts"]},{"id":"limen.integrations","title":"External adapters","gloss":"Herdr, GitHub, seat, and finish delivery connect to jobs.","body":["Adapters connect file-backed jobs to visible panes, coordinator prompts, optional finish delivery, and authorized GitHub requests.","Each adapter records evidence without replacing job files, Git, or the owning coordinator's judgment.","The seat owns ongoing work; a remote laptop is a window rather than a second cabinet.","External services mirror or request work; they do not authorize merges."],"status":"ready","layer":"mid","places":["limen.integrations.github","limen.integrations.herdr","limen.integrations.finish","limen.integrations.seat"],"sources":["src/integrations/herdr.ts","src/integrations/coordinator-wake.ts","src/integrations/finish-webhook.ts","src/integrations/github-poller.ts","src/project/seat.ts","spec/vision.md"]},{"id":"limen.cabinet","title":"Job cabinet","gloss":"Files and Git keep job state, candidate work, and evidence.","body":["Each project or non-Git workspace owns a local .limen/jobs cabinet.","Jobs name an explicit repository, worktree, branch, engine, role, and execution history.","Files preserve operational evidence; Git preserves candidate contents and landing evidence.","A worktree isolates a checkout, not credentials or arbitrary executable code."],"status":"ready","layer":"floor","places":["limen.cabinet.records","limen.cabinet.git"],"sources":["src/job/job.ts","src/job/record.ts","src/project/git.ts","src/commands/spawn.ts","src/commands/continue.ts","src/commands/prune.ts"]}],"places":{"limen.commands":{"id":"limen.commands","title":"Operator commands","module":"limen.commands","gloss":"The CLI owns explicit operator actions, from initialization and launch through inspection, steering, stopping, landing, and retention.","body":["Spawn resolves repository boundaries, engine choice, role preambles, and hosted versus detached execution.","Continuation creates a new record and seeds its transcript from the finished parent's recorded engine session.","Status joins job files, Git evidence, and Herdr observations; a clean termination yields a candidate to inspect.","Land merges a done job's committed branch into the clean, currently checked-out target after explicit confirmation.","Prune removes unused worktrees; retirement removes finished records only when their branches are landed or gone.","Init writes missing furniture without replacing existing project prose.","The Linear command toggles a Markdown configuration; agents own mirroring, not this CLI."],"status":"ready","sources":["bin/limen","src/main.ts","src/commands/spawn.ts","src/commands/continue.ts","src/commands/steer.ts","src/commands/stop.ts","src/commands/status.ts","src/commands/land.ts","src/commands/prune.ts","src/commands/init.ts","src/commands/linear.ts"],"path":".limen/picture/nodes/limen.commands.md"},"limen.picture.build":{"id":"limen.picture.build","title":"Dataset validation and HTML build","module":"limen.picture","gloss":"The reader loads only flat Markdown files under nodes, edges, features, and journeys.","body":["The model builder validates identities, containment, relations, and references, preserving visible diagnostics rather than inventing missing places.","Feature touches resolve only to modules; journey steps resolve to places and retain order and repeats.","Unknown overlay references produce warnings; malformed lists produce errors, and edges involving overlays are dropped.","HTML assembly embeds the model, styles, and viewer script into one local file.","Build publishes HTML atomically; strict mode fails on error diagnostics.","The dataset owns architectural claims; this generator owns validation and rendering, not source surveying."],"status":"ready","sources":["src/picture/dataset.ts","src/picture/picture-model.ts","src/picture/html.ts","src/picture/picture-build.ts","templates/picture/CONTRACT.md","test/picture-overlay.test.ts"],"path":".limen/picture/nodes/limen.picture.build.md"},"limen.picture.viewer":{"id":"limen.picture.viewer","title":"Offline map viewer","module":"limen.picture","gloss":"The browser receives embedded data, styles, and script with no external assets required by the HTML assembly.","body":["The contract defines a plant overview, containment drill-down, deep links, search, and evidence details.","The view distinguishes partial places and exposes model diagnostics.","The header carries the dataset revision and can show a differing build-time checkout tip.","Features and journeys appear separately from places; hover or selection lights only their listed places at the current containment level.","Journey navigation preserves step order and repeats; a plant step names the whole project without lighting a block."],"status":"ready","sources":["picture/viewer/template.html","picture/viewer/viewer.js","picture/viewer/viewer.css","templates/picture/CONTRACT.md","src/picture/html.ts"],"path":".limen/picture/nodes/limen.picture.viewer.md"},"limen.picture.tick":{"id":"limen.picture.tick","title":"One-pass picture watcher","module":"limen.picture","gloss":"Tick treats the plant revision as its only source cursor.","body":["It ignores specifications, documentation, project guidance, root Markdown, and the dataset before classifying Git paths.","Structural additions, deletions, renames, and modified cited sources can request a refresh.","An optional branch constraint skips a pass when the primary checkout has another branch checked out.","A process-owned tick lock prevents concurrent decisions and permits takeover after its owner exits.","A live or already-attempted job suppresses another request for the same tip.","Missing model flags yield an advisory; tick has no fallback model or internal scheduling loop.","A plant without a revision requires a first map started by hand."],"status":"ready","sources":["src/project/picture-tick.ts","templates/picture/CONTRACT.md"],"path":".limen/picture/nodes/limen.picture.tick.md"},"limen.picture.watch":{"id":"limen.picture.watch","title":"Top-branch picture hook","module":"limen.picture","gloss":"Watch installs one reference-transaction hook in the primary repository's own hooks directory.","body":["It refuses to replace an unrelated hook or use a hooksPath outside the repository.","Only a committed move of the configured top branch starts a background tick.","The hook clears inherited Git overrides, wake routes, and job identity before launching tick.","The hook never delays or rejects the ref update.","No hook means off; operator timer units no longer schedule picture refresh."],"status":"ready","sources":["src/project/picture-watch.ts","src/commands/picture.ts","templates/picture/CONTRACT.md","docs/seat/README.md"],"path":".limen/picture/nodes/limen.picture.watch.md"},"limen.runtime.detached":{"id":"limen.runtime.detached","title":"Detached wrapper","module":"limen.runtime","gloss":"A detached Node wrapper starts the selected engine in its worktree and consumes its JSON event stream.","body":["The wrapper records activity, tool counts, assistant results, and explicit error or abort reasons.","A timeout and tool-call ceiling bound detached work.","Signals interrupt the process group; confirmed stalled children trigger owned-process cleanup.","The wrapper finalizes the record after engine termination; exit zero is not proof of accepted product work."],"status":"ready","sources":["src/runtime/wrapper.ts","src/runtime/stream.ts"],"path":".limen/picture/nodes/limen.runtime.detached.md"},"limen.runtime.hosted":{"id":"limen.runtime.hosted","title":"Hosted supervisor","module":"limen.runtime","gloss":"A detached supervisor starts an interactive engine through Herdr and follows its recorded or relocated pane.","body":["The supervisor owns terminal state; the hosted hook reports activity and session shutdown.","A settled or unseen Herdr tab does not by itself mean the job ended.","Hosted work has no outer timeout or tool-call ceiling; confirmed idle tool children still receive containment.","A lost supervisor can be recovered while its hosted engine remains positively located."],"status":"ready","sources":["src/runtime/supervisor.ts","src/runtime/reap.ts","hook/hosted.ts"],"path":".limen/picture/nodes/limen.runtime.hosted.md"},"limen.runtime.engine":{"id":"limen.runtime.engine","title":"Pi and OMP profiles","module":"limen.runtime","gloss":"The profile table owns binary selection, engine flags, session storage arguments, and extension loading arguments.","body":["New jobs default to OMP unless an explicit selection overrides it.","Continuation retains the parent's recorded engine; old records without one resolve to Pi.","A shared stream parser translates assistant and tool events into Limen observations.","OMP receives a job-local view of legacy Pi skills; native skill directories win name collisions.","For OMP pi-claude models, argument construction explicitly loads the local bridge when present despite disabling other user extensions.","Pi and OMP are external programs; Limen does not implement their providers or authentication stores."],"status":"ready","sources":["src/runtime/engine.ts","src/runtime/stream.ts","spec/features/done/2026-09/F727-pi-omp-interchangeable-engine/outcome.md"],"path":".limen/picture/nodes/limen.runtime.engine.md"},"limen.runtime.liveness":{"id":"limen.runtime.liveness","title":"Process liveness and recovery","module":"limen.runtime","gloss":"Process probes verify birth identity before signaling attributed descendants.","body":["Linux probes read /proc; Darwin probes call the packaged Ruby identity helper.","Unavailable identity creates durable uncertainty instead of permission to kill an unrelated process.","The reaper confirms lost owners, recovers positively located hosted engines, or marks unrecoverable jobs failed.","The operator guide still describes missing Linux parity despite the implemented Linux identity probe.","Linux operational parity remains unproved by this map pass."],"status":"partial","sources":["src/runtime/contain.ts","src/runtime/reap.ts"],"path":".limen/picture/nodes/limen.runtime.liveness.md"},"limen.sessions.wake":{"id":"limen.sessions.wake","title":"Coordinator subscriptions and wakes","module":"limen.sessions","gloss":"The wake hook watches subscribed job records and injects completion or stall messages into the coordinator session.","body":["Delivery receipts require an entered turn, a successful assistant answer, and settlement rather than message acceptance alone.","An idle owning coordinator may receive fallback delivery when no subscriber confirms completion.","Unconfirmed automatic delivery stops after bounded attempts; deliberate recovery remains visible.","The hook also publishes advisory running-job metadata without making Herdr the record authority."],"status":"ready","sources":["hook/wake.ts","src/commands/sweep.ts"],"path":".limen/picture/nodes/limen.sessions.wake.md"},"limen.sessions.guidance":{"id":"limen.sessions.guidance","title":"Project guidance and role prompts","module":"limen.sessions","gloss":"Project Markdown owns durable intent, coding practice, and product state.","body":["Package templates supply the shop manual, speech register, and role preambles unless project files override them.","The communication hook inserts stable guidance into system prompts and supplies short audience cues per turn.","Every audience cue requests short, plain technical English with one exact name for each thing.","Tool-result reminders recall relevant vision, style, or specification rules.","Drift reporting identifies copied or overridden defaults without overwriting project judgment.","Worker guidance points to the board and vision instead of treating a terminal state as completed intent."],"status":"ready","sources":["hook/communication.ts","src/project/inherit.ts","templates/worker.md","templates/limen-extension.ts","templates/agents.md","spec/vision.md","spec/build.md"],"path":".limen/picture/nodes/limen.sessions.guidance.md"},"limen.sessions.worker":{"id":"limen.sessions.worker","title":"Worker steering and hosted reporting","module":"limen.sessions","gloss":"The steering hook claims inbox messages and sends them to the worker between tools.","body":["Delivered markers preserve message history; failed sends leave messages available for later sweeps.","The hosted hook records engine PID, activity, tool counts, and session shutdown beside the job record.","Its finish tool saves the handoff and shuts down the session; the supervisor publishes terminal state.","A turn ending alone does not finish a hosted job."],"status":"ready","sources":["hook/steering.ts","hook/hosted.ts"],"path":".limen/picture/nodes/limen.sessions.worker.md"},"limen.integrations.github":{"id":"limen.integrations.github","title":"GitHub doorbell and isolated poller","module":"limen.integrations","gloss":"The GitHub adapter binds an installed repository to its owning, interactive Herdr coordinator.","body":["A separate Unix poller owns the App key and authoritative claims outside worker-readable project copies.","The poller verifies collaborator permission and open PR identity before carrying bounded, untrusted context to the coordinator.","The coordinator chooses a hosted review, hosted work, or a recorded no-job answer.","Pinned reviews fetch the actual PR base and head before spawn.","The poller reconciles job evidence before posting start and terminal receipts; it never approves or merges.","The board records one-seat proof; routing across two owning seats remains unproved."],"status":"partial","sources":["src/commands/github.ts","src/integrations/github-poller.ts","src/integrations/github-review.ts","spec/features/done/2026-10/F014-github-doorbell/ticket.md","spec/build.md"],"path":".limen/picture/nodes/limen.integrations.github.md"},"limen.integrations.herdr":{"id":"limen.integrations.herdr","title":"Herdr panes and coordinator prompts","module":"limen.integrations","gloss":"The adapter creates role spaces, hosted tabs, watch tabs, and diff views through the external Herdr CLI.","body":["Herdr owns hosted engine process trees; Limen records pane and tab addresses for observation and reopening.","Finalization closes recorded job tabs while retaining job files.","For coordinators without a Pi session, origin-pane routes a completion prompt through Herdr.","The wake receipt records delivery only after Herdr observes a working turn.","The foreground-process recovery fallback recognizes pi or node, not omp; the specified liveness fix remains absent."],"status":"partial","sources":["src/integrations/herdr.ts","src/integrations/coordinator-wake.ts","src/commands/status.ts","spec/features/active/F728-hosted-engine-liveness/ticket.md"],"path":".limen/picture/nodes/limen.integrations.herdr.md"},"limen.integrations.finish":{"id":"limen.integrations.finish","title":"Opt-in finish delivery","module":"limen.integrations","gloss":"The finish adapter resolves an optional configuration from the primary checkout or explicit operator path.","body":["Spawn captures configuration and ticket-author routing; continuation preserves its parent's selection.","Finalization claims one job-state event and launches the packaged shell sender within a bounded deadline.","The adapter records routing and per-target transport receipts beside the job.","Sender acceptance does not prove an owner turn and does not replace the coordinator wake."],"status":"ready","sources":["src/integrations/finish-webhook.ts","src/job/record.ts"],"path":".limen/picture/nodes/limen.integrations.finish.md"},"limen.integrations.seat":{"id":"limen.integrations.seat","title":"Seat registry and operator timers","module":"limen.integrations","gloss":"The seat registry tracks initialized projects outside their individual job cabinets.","body":["Sweep checks registered cabinets for unheard terminal jobs or hosted advisories after coordinator silence.","An exclusive event receipt precedes the notification transport, preventing ambiguous repeated rings.","Operators install and enable timers; Limen does not infer a deployed timer from shipped service files.","Picture refresh now uses an opt-in repository hook, not the deleted limen-picture service and timer.","The GitHub poller uses a separate private registration path, not this general project registry."],"status":"ready","sources":["src/project/seat.ts","src/commands/sweep.ts","docs/seat/README.md"],"path":".limen/picture/nodes/limen.integrations.seat.md"},"limen.cabinet.records":{"id":"limen.cabinet.records","title":"Durable job records","module":"limen.cabinet","gloss":"The record layer publishes terminal state only after commit evidence, finish time, and terminal detail become durable.","body":["Task, result, log, activity, transcript, and notification receipts remain ordinary files beside state.","The cabinet holds steering inboxes and coordinator subscriptions; transport claims prevent concurrent delivery from inventing ownership.","Continuation preserves the parent record and writes into a separate child transcript.","Finalization triggers coordinator wakes and optional finish delivery after publishing state."],"status":"ready","sources":["src/job/job.ts","src/job/record.ts","src/commands/spawn.ts","src/commands/continue.ts","src/commands/steer.ts"],"path":".limen/picture/nodes/limen.cabinet.records.md"},"limen.cabinet.git":{"id":"limen.cabinet.git","title":"Git worktrees and candidate branches","module":"limen.cabinet","gloss":"Git owns candidate branches, review heads, committed contents, and merge ancestry.","body":["Spawn creates sibling worktrees or reuses an isolated branch checkout; reviews use detached candidate checkouts.","Workspace jobs select one immediate child repository explicitly.","Landing uses Git merge, while status and retirement recognize ancestry or equivalent patch identities.","Pruning preserves live jobs and retained paths; a surviving branch can restore a pruned checkout."],"status":"ready","sources":["src/project/git.ts","src/commands/spawn.ts","src/commands/land.ts","src/commands/prune.ts"],"path":".limen/picture/nodes/limen.cabinet.git.md"}},"edges":[{"id":"limen.edge.commands-detached","from":"limen.commands","to":"limen.runtime.detached","relation":"hosts","title":"Launch a background wrapper","body":"Outside Herdr, or with --detached, commands start an unreferenced wrapper process and wait for its recorded handshake."},{"id":"limen.edge.commands-git","from":"limen.commands","to":"limen.cabinet.git","relation":"calls","title":"Create isolated work and land candidates","body":"Commands call the Git boundary to create worktrees, merge explicit candidates, and remove unused checkouts. Review creation detaches the candidate checkout; it does not merge the reviewed branch."},{"id":"limen.edge.commands-github","from":"limen.commands","to":"limen.integrations.github","relation":"calls","title":"Operate the opt-in GitHub doorbell","body":"The github command connects or disconnects a binding, checks the registered coordinator, and dispatches poll or hosted request delivery."},{"id":"limen.edge.commands-guidance","from":"limen.commands","to":"limen.sessions.guidance","relation":"reads","title":"Resolve role preambles and setup defaults","body":"Spawn resolves a project role preamble before the packaged default. Init copies only missing project furniture and reports inherited-guidance drift."},{"id":"limen.edge.commands-herdr","from":"limen.commands","to":"limen.integrations.herdr","relation":"calls","title":"Open panes and inspect visible coordinators","body":"Hosted spawn calls the Herdr adapter to create a shell tab. Detached launch can open a watch tab; status queries visible agents without making pane state authoritative."},{"id":"limen.edge.commands-hosted","from":"limen.commands","to":"limen.runtime.hosted","relation":"hosts","title":"Launch a hosted supervisor","body":"Hosted launch opens a shell tab and starts a detached supervisor. The supervisor, not the command's lifetime, owns interactive engine startup and observation."},{"id":"limen.edge.commands-picture-build","from":"limen.commands","to":"limen.picture.build","relation":"calls","title":"Build the local architecture artifact","body":"Picture build passes the dataset, output path, and checkout tip to the offline generator. Strict mode exits unsuccessfully when the returned model contains error diagnostics."},{"id":"limen.edge.commands-picture-tick","from":"limen.commands","to":"limen.picture.tick","relation":"calls","title":"Run one architecture-refresh decision","body":"Picture tick supplies the resolved repository, dataset directory, explicit model flags, and dry-run choice to the one-pass watcher."},{"id":"limen.edge.commands-picture-watch","from":"limen.commands","to":"limen.picture.watch","relation":"calls","title":"Configure the repository picture hook","body":"The picture command delegates watch status, explicit enable, and explicit disable to the repository hook owner. Enable requires the operator's engine, provider, model, and reasoning flags."},{"id":"limen.edge.commands-records","from":"limen.commands","to":"limen.cabinet.records","relation":"writes","title":"Publish job instructions and lifecycle records","body":"Spawn and continuation publish task, identity, routing, and initial state files. Steer writes inbox messages; stop records requests and can finalize interrupted jobs."},{"id":"limen.edge.detached-engine","from":"limen.runtime.detached","to":"limen.runtime.engine","relation":"depends-on","title":"Use shared engine arguments and event parsing","body":"The wrapper imports profile selection, argument assembly, skill preparation, and the shared stream parser before starting the external engine."},{"id":"limen.edge.detached-liveness","from":"limen.runtime.detached","to":"limen.runtime.liveness","relation":"depends-on","title":"Contain attributed detached descendants","body":"The wrapper uses ownership probes and process-group signals during exhaustion or confirmed child stalls. Unavailable birth identity remains an advisory rather than authority to signal another process."},{"id":"limen.edge.detached-records","from":"limen.runtime.detached","to":"limen.cabinet.records","relation":"writes","title":"Record detached execution and termination","body":"The wrapper writes process readiness, activity, tool evidence, result, and stop reasons. It calls the shared finalizer after exhaustion, interruption, failure, or normal engine termination."},{"id":"limen.edge.finish-records","from":"limen.integrations.finish","to":"limen.cabinet.records","relation":"writes","title":"Preserve finish routing and transport receipts","body":"The finish adapter records its exclusive attempt, selected route, per-target transport evidence, and final sender status beside the job."},{"id":"limen.edge.github-commands","from":"limen.integrations.github","to":"limen.commands","relation":"calls","title":"Start coordinator-selected hosted PR jobs","body":"A selected review or work request calls spawnCommand with --tab and explicit engine flags. Review requests additionally pin the fetched base and candidate head."},{"id":"limen.edge.github-herdr","from":"limen.integrations.github","to":"limen.integrations.herdr","relation":"calls","title":"Carry authorized requests to the owning coordinator","body":"The isolated poller ensures the registered Herdr coordinator is interactive and hands off bounded PR context. An unavailable coordinator leaves a pending receipt without detached fallback."},{"id":"limen.edge.github-records","from":"limen.integrations.github","to":"limen.cabinet.records","relation":"reads","title":"Reconcile PR receipts against actual jobs","body":"The adapter matches request markers and recorded candidate evidence before posting start or terminal comments. Prompt acceptance alone does not establish a started job."},{"id":"limen.edge.hosted-engine","from":"limen.runtime.hosted","to":"limen.runtime.engine","relation":"depends-on","title":"Use the recorded hosted engine profile","body":"The supervisor imports the recorded profile and argument assembly for interactive startup. It also imports shared assistant-message interpretation for final result evidence."},{"id":"limen.edge.hosted-herdr","from":"limen.runtime.hosted","to":"limen.integrations.herdr","relation":"calls","title":"Start and follow the interactive worker","body":"The supervisor starts the selected engine through Herdr and polls its status. It follows moved panes and reports stalls without equating Herdr idle with job termination."},{"id":"limen.edge.hosted-records","from":"limen.runtime.hosted","to":"limen.cabinet.records","relation":"writes","title":"Publish hosted supervision evidence","body":"The supervisor records relocated pane addresses, advisories, final results, and terminal state through the record layer."},{"id":"limen.edge.picture-build-viewer","from":"limen.picture.build","to":"limen.picture.viewer","relation":"generates","title":"Publish a self-contained browser map","body":"The generator embeds validated model data and viewer assets into a self-contained map.html artifact."},{"id":"limen.edge.picture-tick-git","from":"limen.picture.tick","to":"limen.cabinet.git","relation":"reads","title":"Classify source changes since the plant revision","body":"Tick reads Git HEAD and name-status changes from the recorded revision. It discards ignored paths before evaluating structural changes or citation matches."},{"id":"limen.edge.picture-tick-liveness","from":"limen.picture.tick","to":"limen.runtime.liveness","relation":"calls","title":"Check ownership before another refresh decision","body":"Tick checks the tick-lock process and the recorded refresh job's liveness. A live owner suppresses another decision; a dead tick-lock owner permits takeover."},{"id":"limen.edge.picture-tick-model","from":"limen.picture.tick","to":"limen.picture.build","relation":"calls","title":"Read the current dataset revision and citations","body":"Tick calls readPicture to obtain the plant revision and cited node and edge sources before deciding whether to refresh."},{"id":"limen.edge.picture-tick-spawn","from":"limen.picture.tick","to":"limen.commands","relation":"calls","title":"Request one detached picture refresh","body":"Only relevant code changes and complete explicit model flags permit a detached spawn with the picture role. Tick records the returned job ID; the picture worker owns surveying and the revision stamp."},{"id":"limen.edge.picture-viewer-assets","from":"limen.picture.build","to":"limen.picture.viewer","relation":"depends-on","title":"Read packaged viewer assets","body":"Build reads the packaged HTML template, CSS, and JavaScript before assembling the offline document. These are build inputs, distinct from the generated browser artifact."},{"id":"limen.edge.picture-watch-git","from":"limen.picture.watch","to":"limen.cabinet.git","relation":"writes","title":"Install the top-branch hook","body":"Watch writes a repository-local reference-transaction hook."},{"id":"limen.edge.picture-watch-tick","from":"limen.picture.watch","to":"limen.picture.tick","relation":"calls","title":"Start a detached pass after a top-branch move","body":"A committed top-branch move starts one background tick with the configured dataset, branch constraint, and explicit model flags. The hook appends the move and tick output to the project-local picture-watch log."},{"id":"limen.edge.records-finish","from":"limen.cabinet.records","to":"limen.integrations.finish","relation":"calls","title":"Attempt configured finish delivery","body":"Finalization invokes finish delivery after publishing terminal state. The side channel remains opt-in and runs beside the coordinator prompt, not in its place."},{"id":"limen.edge.records-git","from":"limen.cabinet.records","to":"limen.cabinet.git","relation":"reads","title":"Capture candidate commit evidence","body":"Finalization reads the recorded base, branch, and worktree to capture commit history and tip before publishing terminal state."},{"id":"limen.edge.records-herdr","from":"limen.cabinet.records","to":"limen.integrations.herdr","relation":"calls","title":"Wake origin-pane coordinators and settle tabs","body":"After terminal state becomes durable, finalization prompts a recorded origin-pane coordinator when present. It then closes the recorded job tab; job files remain available."},{"id":"limen.edge.runtime-guidance","from":"limen.runtime","to":"limen.sessions.guidance","relation":"composes","title":"Load communication guidance into workers","body":"Both launch paths pass the communication extension to the selected engine alongside the resolved role preamble."},{"id":"limen.edge.runtime-worker-hooks","from":"limen.runtime","to":"limen.sessions.worker","relation":"composes","title":"Attach steering and hosted activity reporting","body":"Both launch paths load worker steering. The hosted path additionally loads the activity reporter and finish tool instead of relying on a JSON event stream."},{"id":"limen.edge.seat-liveness","from":"limen.integrations.seat","to":"limen.runtime.liveness","relation":"calls","title":"Confirm dead owners before seat notifications","body":"Each registered-project sweep calls confirmDeadJobs before identifying notification candidates."},{"id":"limen.edge.seat-records","from":"limen.integrations.seat","to":"limen.cabinet.records","relation":"reads","title":"Find unheard seat events","body":"Sweep reads terminal timestamps, hosted advisories, and coordinator-delivery receipts to identify unheard work after coordinator silence."},{"id":"limen.edge.wake-herdr","from":"limen.sessions.wake","to":"limen.integrations.herdr","relation":"calls","title":"Publish advisory coordinator pane metadata","body":"When Herdr is present, the coordinator hook invokes its CLI for notifications, running-job labels, and pane metadata."},{"id":"limen.edge.wake-liveness","from":"limen.sessions.wake","to":"limen.runtime.liveness","relation":"calls","title":"Reap or recover lost job owners","body":"Coordinator sweeps call the reaper before presenting job state. Positive hosted location permits recovery; uncertain probes do not justify declaring the worker dead."},{"id":"limen.edge.wake-records-read","from":"limen.sessions.wake","to":"limen.cabinet.records","relation":"reads","title":"Observe subscribed jobs and advisories","body":"The coordinator hook reads terminal state, subscription files, results, and advisories to decide whether a wake is eligible."},{"id":"limen.edge.wake-records-write","from":"limen.sessions.wake","to":"limen.cabinet.records","relation":"writes","title":"Claim and confirm coordinator delivery","body":"The coordinator hook writes delivery claims and receipts beside each job. Observed turn entry, successful assistant output, and settlement confirm delivery."},{"id":"limen.edge.worker-records-read","from":"limen.sessions.worker","to":"limen.cabinet.records","relation":"reads","title":"Consume durable steering inbox messages","body":"The worker hook reads queued message files and prior receipts before claiming a message for engine delivery."},{"id":"limen.edge.worker-records-write","from":"limen.sessions.worker","to":"limen.cabinet.records","relation":"writes","title":"Record steering and hosted activity evidence","body":"Worker hooks write steering receipts, hosted activity, tool counts, handoffs, and session-ended evidence. They leave terminal-state publication to runtime finalization."}],"work":[{"id":"f775","code":"F775","group":"needs","signal":"needs","date":"5 Oct","scope":"picture viewer","title":"Adam sees the broad plant and can dig down to decide fast","purpose":"Restore the architecture overview and keep the fast decide path in one view.","decisionLabel":"Proposed design","decision":"This sample keeps the plant on screen at every depth. Every reason opens in the quiet column beside it. Places, work, journeys, and days link to each other in both directions.","ask":"Park this merge as the reference picture, or request a live build of the picture viewer?","options":["Park: keep this file as the reference design. Nothing changes in the live viewer.","Build: open a ticket that moves this layout into the live picture viewer and its HTML build."],"open":"No choice is recorded y rktree. Finished jobs use the committed base...branch range even after worktree pruning. A running job can open a live hunk view in its worktree. Herdr hosts a named diff tab when available. Without hunk or an interactive surface, the command prints the exact Git diff command. The viewer does not approve or merge the candidate."},{"title":"Ticket outcome","purpose":"Why the feature exists, in the words of its ticket.","path":"spec/features/done/2026-09/F050-hunk-diff-tab/ticket.md","excerpt":"At the merge decision the human runs (or the coordinator opens for them) `limen diff <id|suffix|label>` and reviews the job's whole changeset in hunk — in a named Herdr tab when Herdr hosts the session, in the current terminal otherwise. Without hunk on PATH the command prints the exact `git diff` invocation instead. Nothing else in limen changes behavior based on hunk's presence."},{"title":"Cited files","purpose":"Files the map watches for this feature. A change here can refresh the map.","path":".limen/picture/features/limen.feature.f050.md · sources","excerpt":"The map watches 2 files for this feature: spec/features/done/2026-09/F050-hunk-diff-tab/ticket.md; src/commands/diff.ts."}]},{"id":"f053","code":"F053","group":"map","signal":null,"partial":false,"date":"map 3 Oct","scope":"sessions","title":"Guidance stays present and recalls relevant rules","purpose":"Keep the project rules present on every model call and recall the rule that applies now.","decisionLabel":"Recorded behavior","decision":"The communication hook supplies stable project guidance through the system prompt. Short audience cues carry situational context, failed-turn notices, and plain technical English rules. Tool results recall specification, style, or vision rules when the action requires them.","open":"No open item in the map record.","touchKind":"recorded","touches":["limen.sessions.guidance"],"touchNote":"Explicit touch lines in the map record.","evidence":[{"title":"Map feature record","purpose":"Wh
