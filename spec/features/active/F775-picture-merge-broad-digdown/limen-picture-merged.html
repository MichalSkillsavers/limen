for(const j of D.journeys) j.steps.forEach((s,i)=>{const a=(jAt[s.place]??=[]); if(!a.some(x=>x.j===j.id)) a.push({j:j.id,i})});
const edgesAt=id=>D.edges.filter(e=>e.from===id||e.to===id);
const GROUPS=[['needs','Needs Adam','Decide here first'],['wrong','Wrong','Problems to fix'],['picture','Picture work · 3–5 Oct','What changed in the picture'],['map','Map features · snapshot 3 Oct','Source-backed features in the local map']];

/* Routes: every state has one reloadable hash. */
function parse(h){
  const s=decodeURIComponent(h.replace(/^#/,'')).split('/');
  if(s[0]==='work'&&W[s[1]]){const w=W[s[1]];return {view:'work',id:s[1],ev:s[2]==='evidence'&&w.evidence[+s[3]]?+s[3]:null}}
  if(s[0]==='place'&&P[s[1]]){const r={view:'place',id:s[1]};if(s[2]==='via'&&s[3]==='work'&&W[s[4]]&&W[s[4]].touches.includes(s[1]))r.via=s[4];return r}
  if(s[0]==='module'&&M[s[1]]) return {view:'module',id:s[1]};
  if(s[0]==='journey'&&J[s[1]]){const j=J[s[1]];return {view:'journey',id:s[1],step:s[2]==='step'&&j.steps[+s[3]-1]?+s[3]:null}}
  if(s[0]==='day'&&Y[s[1]]) return {view:'day',id:s[1]};
  return {view:'plant',tab:TABS.some(t=>t[0]===s[1])?s[1]:'work'};
}
function tabOf(r){return r.view==='plant'?r.tab:r.view==='work'||(r.view==='place'&&r.via)?'work':r.view==='journey'?'journeys':r.view==='day'?'days':'places'}
const workOf=r=>r.view==='work'?r.id:r.view==='place'&&r.via?r.via:null;
function placeHref(id,r){
  const w=workOf(r);
  if(w&&W[w].touches.includes(id)) return '#place/'+id+'/via/work/'+w;
  if(r.view==='journey'){const i=J[r.id].steps.findIndex(s=>s.place===id);if(i>=0) return '#journey/'+r.id+'/step/'+(i+1)}
  return P[id]?'#place/'+id:'#module/'+id;
}
function parentHref(r){
  if(r.view==='work') return r.ev!==null?'#work/'+r.id:'#plant/work';
  if(r.view==='place') return r.via?'#work/'+r.via:'#plant/places';
  if(r.view==='module') return '#plant/places';
  if(r.view==='journey') return r.step?'#journey/'+r.id:'#plant/journeys';
  if(r.view==='day') return '#plant/days';
  return '#plant/'+r.tab;
}

/* Masthead */
function renderMast(r){
  const cur=workOf(r);
  document.getElementById('mast').innerHTML=`<a class="brand" href="#plant"><b>limen · Picture</b><span>Plant, work, and decisions</span></a>`+
    D.pins.map(p=>`<a class="pin ${p.kind}" href="#work/${p.work}" aria-current="${cur===p.work}"><span class="lab">${esc(p.label)} <small>· ${esc(p.date)} · ${esc(p.scope)}</small></span><span class="txt">${esc(p.text)}</span></a>`).join('');
}

/* Atlas: built once, then lit per route. */
const stage=document.getElementById('stage');
function chip(id,band){
  const p=P[id], n=(workAt[id]||[]).length;
  const inner=band?`<span class="nm"><b>${esc(p.title)}</b><span>${esc(M[id].gloss)}</span></span>`:`<span class="nm">${esc(p.title)}</span>`;
  return `<a class="place" data-place="${id}" href="#place/${id}" title="${esc(p.gloss)}">${p.status==='partial'?'<i class="pd" aria-label="partial"></i>':''}${inner}<span class="ct" aria-label="${n} work items">${n||''}</span></a>`;
}
function modCard(m,cls){
  return `<div class="mod ${cls}" data-mod="${m.id}"><div class="fhead"><div class="mod-head"><a href="#module/${m.id}" title="Open module">${esc(m.title)}</a></div><p>${esc(m.gloss)}</p></div><div class="places">${m.places.map(id=>chip(id)).join('')}</div></div>`;
}
function buildAtlas(){
  document.getElementById('plantLink').textContent=D.plant.title;
  document.getElementById('plantGloss').textContent=D.plant.gloss;
  document.getElementById('facts').innerHTML=`${D.modules.length} modules · ${Object.keys(P).length} places · ${D.edges.length} connections<br>map snapshot ${D.plant.revision} · ${D.plant.date} · design sample, not live`;
  const entry=D.modules.find(m=>m.layer==='entry'), floor=D.modules.find(m=>m.layer==='floor'), mids=D.modules.filter(m=>m.layer==='mid');
  stage.insertAdjacentHTML('beforeend',
    `<div class="band" data-mod="${entry.id}">${chip(entry.id,true)}</div>`+
    `<div class="midrow">${mids.map(m=>modCard(m,'')).join('')}</div>`+
    modCard(floor,'floor'));
  stage.querySelectorAll('.place').forEach(a=>{
    a.addEventListener('mouseenter',()=>hintRows(a.dataset.place,true));
    a.addEventListener('mouseleave',()=>hintRows(a.dataset.place,false));
  });
}
function hintRows(id,on){document.querySelectorAll('#read .row[data-places]').forEach(r=>{if(r.dataset.places.split(' ').includes(id)) r.classList.toggle('hint-on',on)})}

function lighting(r){
  const L={lit:new Set(),focus:null,near:new Set(),mfocus:null,wires:[],badges:{},text:'',mode:''};
  const sub=set=>D.edges.filter(e=>set.has(e.from)&&set.has(e.to)).map(e=>({e,cls:'sel'}));
  const w=workOf(r);
  if(w){const x=W[w];x.touches.forEach(t=>L.lit.add(t));L.wires=sub(L.lit);
    const mods=new Set(x.touches.map(modOf));
    L.text=`<b>${esc(x.code)} · ${esc(x.title)}</b> lights ${x.touches.length} ${x.touches.length===1?'place':'places'} in ${mods.size} ${mods.size===1?'module':'modules'}${x.touchKind==='proposed'?' (proposed touches)':''}.`;L.mode='on'}
  if(r.view==='place'){L.focus=r.id;for(const e of edgesAt(r.id)){const o=e.from===r.id?e.to:e.from;if(P[o])L.near.add(o);L.wires.push({e,cls:'ink'})}
    if(!r.via){L.text=`<b>${esc(P[r.id].title)}</b> · ${edgesAt(r.id).length} connections · named by ${(workAt[r.id]||[]).length} work items.`;L.mode='focus'}
    else L.text+=` Open place: <b>${esc(P[r.id].title)}</b>.`}
  if(r.view==='module'){L.mfocus=r.id;const inside=id=>modOf(id)===r.id;
    for(const e of D.edges) if(inside(e.from)!==inside(e.to)){L.wires.push({e,cls:'ink'});const o=inside(e.from)?e.to:e.from;if(P[o])L.near.add(o)}
    M[r.id].places.forEach(p=>L.lit.add(p));
    L.text=`<b>${esc(M[r.id].title)}</b> · ${L.wires.length} connections cross its border to ${new Set([...L.near].map(modOf)).size} modules.`;L.mode='focus'}
  if(r.view==='journey'){const j=J[r.id];j.steps.forEach((s,i)=>{L.lit.add(s.place);(L.badges[s.place]??=[]).push(i+1)});
    for(let i=1;i<j.steps.length;i++){const a=j.steps[i-1].place,b=j.steps[i].place;if(a!==b)L.wires.push({e:{from:a,to:b,k:i},cls:'sel'})}
    if(r.step) L.focus=j.steps[r.step-1].place;
    L.text=`<b>${esc(j.title)}</b> · ${j.steps.length} ordered steps through ${L.lit.size} places.${r.step?` Step ${r.step}: <b>${esc(P[L.focus].title)}</b>.`:''}`;L.mode='on'}
  if(r.view==='day'){const d=Y[r.id];d.items.forEach(it=>W[it.work].touches.forEach(t=>L.lit.add(t)));L.wires=sub(L.lit);
    L.text=`<b>${esc(d.title)}</b> · ${d.items.length} entries light ${L.lit.size} places.`;L.mode='on'}
  if(r.view==='plant') L.text=`Nothing selected. All ${D.modules.length} modules and their connections are in view. Pick work to light its places.`;
  return L;
}
function applyAtlas(r){
  const L=lighting(r), atlas=document.getElementById('atlas');
  const lens=L.lit.size||L.focus||L.mfocus;
  stage.classList.toggle('lens',!!lens);
  stage.querySelectorAll('.place').forEach(a=>{const id=a.dataset.place;
    a.classList.toggle('lit',L.lit.has(id));a.classList.toggle('focus',L.focus===id);a.classList.toggle('near',L.near.has(id)&&!L.lit.has(id));
    a.setAttribute('href',placeHref(id,r));a.querySelector('.badge')?.remove();
    if(L.badges[id]){const cur=r.step&&J[r.id].steps[r.step-1].place===id;a.insertAdjacentHTML('beforeend',`<span class="badge${cur?' cur':''}">${L.badges[id].join('·')}</span>`)}});
  stage.querySelectorAll('[data-mod]').forEach(m=>m.classList.toggle('mfocus',m.dataset.mod===L.mfocus));
  const ll=document.getElementById('lightline');ll.className='lightline '+L.mode;
  ll.innerHTML=`<i class="sw"></i><span>${L.text}</span>${r.view!=='plant'?`<a href="#plant/${tabOf(r)}">Clear selection</a>`:''}`;
  const uniq=new Map();for(const x of L.wires) uniq.set(x.e.from+'|'+x.e.to,[x.e.from,x.e.to,x.cls]); /* one wire per direction; focus ink wins */
  atlas.dataset.wires=JSON.stringify([...uniq.values()]);
  drawWires();
}

/* Wires: measured from the live layout, so they follow resizes. */
function box(el){const s=stage.getBoundingClientRect(),b=el.getBoundingClientRect();return {l:b.left-s.left,t:b.top-s.top,r:b.right-s.left,b:b.bottom-s.top,w:b.width,h:b.height,x:b.left-s.left+b.width/2,y:b.top-s.top+b.height/2}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function path(a,b,jit=0,same=false){
  const dx=b.x-a.x, dy=b.y-a.y, hsep=a.r<b.l-6||b.r<a.l-6;
  if(same&&!hsep){ /* stacked in one module: bow out to the right */
    const k=16+Math.abs(dy)/5;return `M${a.r} ${a.y+jit}C${a.r+k} ${a.y+jit} ${b.r+k} ${b.y+jit} ${b.r} ${b.y+jit}`}
  if(hsep&&Math.abs(dx)>=Math.abs(dy)*0.9){ /* side by side */
    const right=dx>0, x1=right?a.r:a.l, x2=right?b.l:b.r, k=(x2-x1)/2;
    return `M${x1} ${a.y+jit}C${x1+k} ${a.y+jit} ${x2-k} ${b.y+jit} ${x2} ${b.y+jit}`}
  let x1=a.x, x2=b.x; /* above and below: a wide box meets a narrow one straight */
  if(a.w>b.w*1.5) x1=clamp(b.x,a.l+14,a.r-14); else if(b.w>a.w*1.5) x2=clamp(a.x,b.l+14,b.r-14);
  x1+=jit;x2+=jit;
  const y1=dy>0?a.b:a.t, y2=dy>0?b.t:b.b, k=(y2-y1)/2;
  return `M${x1} ${y1}C${x1} ${y1+k} ${x2} ${y2-k} ${x2} ${y2}`;
}
function anchorEl(id){return stage.querySelector(`.place[data-place="${CSS.escape(id)}"]`)||stage.querySelector(`[data-mod="${CSS.escape(id)}"]`)}
const layerOf=el=>el.closest('.band')?0:el.closest('.floor')?2:1;
function poly(pts){ /* polyline with small rounded corners */
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){const [px,py]=pts[i-1],[x,y]=pts[i],[nx,ny]=pts[i+1];
    const r=Math.min(7,Math.hypot(x-px,y-py)/2,Math.hypot(nx-x,ny-y)/2);
    d+=`L${x-Math.sign(x-px)*r} ${y-Math.sign(y-py)*r}Q${x} ${y} ${x+Math.sign(nx-x)*r} ${y+Math.sign(ny-y)*r}`}
  const [lx,ly]=pts[pts.length-1];return d+`L${lx} ${ly}`;
}
function wireRoute(A,B,jit,same){
  /* Between layers, a wire runs down the left rail of its middle module, so it never crosses a module title. */
  const la=layerOf(A),lb=layerOf(B);
  if(la===lb) return path(box(A),box(B),jit,same);
  const down=la<lb,[U,V]=down?[A,B]:[B,A],u=box(U),v=box(V);
  let pts;
  if(layerOf(U)===1){const m=box(U.closest('.mod')),rx=m.l+5+jit,gy=m.b+22,tx=clamp(rx,v.l+14,v.r-14);pts=[[u.l,u.y],[rx,u.y],[rx,gy],[tx,gy],[tx,v.t]]}
  else if(layerOf(V)===1){const m=box(V.closest('.mod')),rx=m.l+5+jit;pts=[[rx,u.b],[rx,v.y],[v.l,v.y]]}
  else{const g=stage.querySelectorAll('.midrow .mod'),gx=(box(g[0]).r+box(g[1]).l)/2+jit,gy=v.t-22,tx=clamp(gx,v.l+14,v.r-14);pts=[[gx,u.b],[gx,gy],[tx,gy],[tx,v.t]]}
  if(!down) pts.reverse();
  return poly(pts);
}
const DEFS=`<defs>${[['g','#a3a7ad'],['t','#0d6b62'],['k','#1c1e22']].map(([n,c])=>`<marker id="m${n}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="${c}"/></marker>`).join('')}</defs>`;
function drawWires(){
  /* Base: one wire per module pair, with a count of place-level links. */
  const pairs={};
  for(const e of D.edges){const a=modOf(e.from),b=modOf(e.to);if(a===b)continue;const k=[a,b].sort().join('|');(pairs[k]??={a:[a,b].sort()[0],b:[a,b].sort()[1],fw:0,bw:0}); if(a===pairs[k].a)pairs[k].fw++;else pairs[k].bw++}
  const order=D.modules.map(m=>m.id);
  let base=DEFS;
  for(const p of Object.values(pairs)){
    const a=box(anchorEl(p.a)),b=box(anchorEl(p.b));let fw=p.fw,bw=p.bw,d,at=L=>L/2;
    const sameRow=Math.abs(a.y-b.y)<20, ia=order.indexOf(p.a), ib=order.indexOf(p.b);
    if(sameRow&&Math.abs(ia-ib)>1){ /* skip a neighbour: dip below the row */
      const L=a.x<b.x?a:b,R=a.x<b.x?b:a,x1=L.l+L.w*.78,x2=R.l+R.w*.22,y=L.b;
      d=`M${x1} ${y}C${x1} ${y+34} ${x2} ${y+34} ${x2} ${y}`;at=L=>L*.2;if(L!==a)[fw,bw]=[bw,fw]}
    else if(!sameRow&&a.w>400&&b.w>400){ /* entry band to floor: pass through the first gap of the middle row */
      const g=stage.querySelectorAll('.midrow .mod'),g1=box(g[0]),g2=box(g[1]),x=(g1.r+g2.l)/2,T=a.y<b.y?a:b,F=a.y<b.y?b:a;
      d=`M${x} ${T.b}L${x} ${F.t}`;at=()=>22;if(T!==a)[fw,bw]=[bw,fw]}
    else d=path(a,b);
    base+=`<path class="wire" d="${d}" ${fw?'marker-end="url(#mg)"':''} ${bw?'marker-start="url(#mg)"':''}><title>${esc(M[p.a].title)} ↔ ${esc(M[p.b].title)}: ${fw+bw} links</title></path>`;
    const tmp=document.createElementNS('http://www.w3.org/2000/svg','path');tmp.setAttribute('d',d);document.getElementById('base').appendChild(tmp);
    const pt=tmp.getPointAtLength(at(tmp.getTotalLength()));tmp.remove();
    base+=`<circle class="wcount" cx="${pt.x}" cy="${pt.y}" r="9"/><text class="wnum" x="${pt.x}" y="${pt.y}">${fw+bw}</text>`;
  }
  const baseSvg=document.getElementById('base');baseSvg.innerHTML=base;
  const wires=JSON.parse(document.getElementById('atlas').dataset.wires||'[]');
  baseSvg.style.opacity=wires.length||stage.classList.contains('lens')?.35:1;
  let over=DEFS;const seen={};
  wires.forEach(([f,t,cls])=>{const A=anchorEl(f),B=anchorEl(t);if(!A||!B)return;const key=[f,t].sort().join('|');const n=(seen[key]=(seen[key]||0)+1);
    over+=`<path class="wire ${cls}" data-from="${f}" data-to="${t}" d="${wireRoute(A,B,[0,4,-4,8][n-1]||0,!!(P[f]&&P[t]&&modOf(f)===modOf(t)))}" marker-end="url(#m${cls==='ink'?'k':'t'})"/>`});
  document.getElementById('over').innerHTML=over;
}

/* Reading column */
function tag(x){
  if(x.signal==='needs') return '<span class="tag needs">Needs Adam</span>';
  if(x.signal==='wrong') return '<span class="tag wrong">Wrong</span>';
  if(x.signal==='changed') return '<span class="tag changed">Changed</span>';
  if(x.partial) return '<span class="tag partial">Partial</span>';
  return '';
}
function row(key,href,open,kind,title,pp,meta,places,sub){
  return `<a class="row${sub?' sub':''}" data-key="${key}" href="${href}" aria-expanded="${open}" ${places?`data-places="${places.join(' ')}"`:''}><span class="kind">${kind}</span><span><span class="t">${title}</span><span class="pp">${pp}</span><span class="meta">${meta}</span></span><span class="ch" aria-hidden="true">${open?'−':'↗'}</span></a>`;
}
function placeList(ids,r,opts={}){
  return `<div class="plist">${ids.map(id=>`<a class="pl${opts.cur===id?' cur':''}" data-key="pl:${id}" data-hover="${id}" href="${opts.href?opts.href(id):placeHref(id,r)}"><b>${esc(nodeTitle(id))}</b><em>${esc(M[modOf(id)].title)}</em><span>${esc(P[id]?P[id].gloss:M[id].gloss)}</span></a>`).join('')}</div>`;
}
function edgeRows(es,r){
  return `<div class="elist">${es.map(e=>`<div class="erow" data-wire="${e.from}|${e.to}"><a href="${placeHref(e.from,r)}">${esc(nodeTitle(e.from))}</a><span class="rel">${esc(e.relation)} →</span><a href="${placeHref(e.to,r)}">${esc(nodeTitle(e.to))}</a><small>${esc(e.title)}</small></div>`).join('')}</div>`;
}
function journeysThrough(ids){
  return D.journeys.map(j=>({j,n:new Set(j.steps.map(s=>s.place).filter(p=>ids.includes(p))).size})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
}
function placeBody(id,r,lead=true){
  const p=P[id], out=edgesAt(id).filter(e=>e.from===id), inn=edgesAt(id).filter(e=>e.to===id), ws=workAt[id]||[], js=jAt[id]||[];
  return `${lead?`<p class="lead"><b>What this place is for</b>${esc(p.gloss)}</p>`:''}
    ${p.status==='partial'?`<div class="box" style="background:var(--amber-bg);color:#6b3c03"><b class="k" style="color:var(--amber)">Partial in the map</b>The map marks this place partial. Its record below names what is missing.</div>`:''}
    ${p.body.length?`<div class="blk"><h4>How it works</h4>${p.body.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`:''}
    <div class="blk"><h4>In module</h4><div class="inl"><a href="#module/${p.module}">${esc(M[p.module].title)}</a></div></div>
    <div class="blk"><h4>Connections<small>${out.length} out · ${inn.length} in</small></h4>${edgeRows([...out,...inn],r)}</div>
    <div class="blk"><h4>Work that touches this place<small>${ws.length}</small></h4>${ws.length?`<div class="inl">${ws.map(w=>`<a href="#work/${w}" data-key="go:${w}">${esc(W[w].code)} · ${esc(W[w].title)}</a>`).join('')}</div>`:'<p class="note">No work item names this place.</p>'}</div>
    <div class="blk"><h4>Journeys through this place<small>${js.length}</small></h4>${js.length?`<div class="inl">${js.map(x=>`<a href="#journey/${x.j}/step/${x.i+1}">${esc(J[x.j].title)} · step ${x.i+1}</a>`).join('')}</div>`:'<p class="note">No journey passes here.</p>'}</div>
    <div class="blk"><h4>Cited files</h4><p class="note path">${p.sources.map(esc).join(' · ')}</p><p class="note">Map record: <span class="path">${esc(p.path)}</span></p></div>`;
}
function workMid(w,r){
  const evs=w.evidence.map((e,i)=>{const open=r.view==='work'&&r.ev===i;
    return `<a class="evl" data-key="ev:${w.id}:${i}" href="${open?'#work/'+w.id:'#work/'+w.id+'/evidence/'+i}" aria-expanded="${open}"><span><b>${esc(e.title)}</b><span>${esc(e.purpose)}</span></span><i>${open?'Close':'Open evidence ↘'}</i></a>`+
      (open?`<article class="deep" id="deep"><a class="back" href="#work/${w.id}">← Back to ${esc(w.code)} detail</a><div class="eyebrow">Evidence · source</div><h3>${esc(e.title)}</h3><p class="note path">${esc(e.path)}</p><div class="excerpt">${esc(e.excerpt)}</div><p class="stop">Stop here. This is the cited fact. Read the decision above for what it means.</p></article>`:'');}).join('');
  const viaPlace=r.view==='place'&&r.via===w.id?r.id:null;
  const sub=D.edges.filter(e=>w.touches.includes(e.from)&&w.touches.includes(e.to));
  const js=journeysThrough(w.touches);
  const days=D.days.filter(d=>d.items.some(i=>i.work===w.id));
  return `<div class="mid">
    ${w.wrong?`<div class="box wrong"><b class="k">Wrong · ${esc(w.date)} · ${esc(w.scope)}</b>${esc(w.wrong)}</div>`:''}
    ${w.ask?`<div class="box needs"><b class="k">Needs Adam · ${esc(w.date)} · ${esc(w.scope)}</b><p class="ask">${esc(w.ask)}</p><ol>${w.options.map(o=>`<li>${esc(o)}</li>`).join('')}</ol></div>`:''}
    <div class="blk"><h4>${esc(w.decisionLabel)}</h4><p>${esc(w.decision)}</p></div>
    <div class="blk"><h4>Open</h4><p>${esc(w.open)}</p></div>
    <div class="blk"><h4>Places touched<small>${w.touches.length} · lit in the plant</small></h4><p class="note">${esc(w.touchNote)}</p>
      ${placeList(w.touches,r,{cur:viaPlace})}
      ${viaPlace?`<article class="deep" id="deep"><a class="back" href="#work/${w.id}">← Back to ${esc(w.code)} detail</a><div class="eyebrow">Place · ${esc(M[P[viaPlace].module].title)}</div><h3>${esc(P[viaPlace].title)}</h3>${placeBody(viaPlace,r)}</article>`:''}</div>
    ${sub.length?`<div class="blk"><h4>How these places connect<small>${sub.length}</small></h4>${edgeRows(sub,r)}</div>`:''}
    ${js.length?`<div class="blk"><h4>Journeys through these places</h4><div class="inl">${js.map(x=>`<a href="#journey/${x.j.id}">${esc(x.j.title)} · ${x.n} shared</a>`).join('')}</div></div>`:''}
    ${days.length?`<div class="blk"><h4>On these days</h4><div class="inl">${days.map(d=>`<a href="#day/${d.id}">${esc(d.title)}</a>`).join('')}</div></div>`:''}
    <div class="blk"><h4>Evidence<small>${w.evidence.length}</small></h4>${evs}</div>
  </div>`;
}
function journeyMid(j,r){
  return `<div class="mid">
    ${j.partial?`<div class="box" style="background:var(--amber-bg);color:#6b3c03"><b class="k" style="color:var(--amber)">Partial in the map</b>${esc(j.notes.filter(n=>/unproved|not/.test(n)).join(' '))}</div>`:''}
    <div class="blk"><h4>Ordered steps<small>select a step to mark it in the plant</small></h4><ol class="steps">${j.steps.map((s,i)=>`<li><a data-key="st:${j.id}:${i}" href="${r.step===i+1?'#journey/'+j.id:'#journey/'+j.id+'/step/'+(i+1)}" aria-current="${r.step===i+1?'step':'false'}" data-hover="${s.place}"><span class="n">${i+1}</span><span><b>${esc(P[s.place].title)}</b><span>${esc(s.text)}</span></span></a></li>`).join('')}</ol>
    ${r.step?`<article class="deep" id="deep"><a class="back" href="#journey/${j.id}">← Back to all steps</a><div class="eyebrow">Step ${r.step} · ${esc(M[P[j.steps[r.step-1].place].module].title)}</div><h3>${esc(P[j.steps[r.step-1].place].title)}</h3>${placeBody(j.steps[r.step-1].place,r)}</article>`:''}</div>
    ${j.notes.length?`<div class="blk"><h4>Limits</h4>${j.notes.map(n=>`<p>${esc(n)}</p>`).join('')}</div>`:''}
    <div class="blk"><h4>Work on these places</h4><div class="inl">${[...new Set(j.steps.flatMap(s=>workAt[s.place]||[]))].map(w=>`<a href="#work/${w}" data-key="go:${w}">${esc(W[w].code)}</a>`).join('')}</div></div>
    <div class="blk"><h4>Evidence</h4><p class="note">Map record: <span class="path">${esc(j.path)}</span></p><p class="note path">${j.sources.map(esc).join(' · ')}</p></div></div>`;
}
function dayMid(d){
  return `<div class="mid">${d.items.map(it=>{const w=W[it.work];return `<a class="ditem" data-key="go:${w.id}" href="#work/${w.id}"><b>${esc(w.code)} · ${esc(w.title)}</b>${tag(w)}<span>${esc(it.text)}</span></a>`}).join('')}
    <p class="note">Dates come from tickets, the board, and file times. Map features carry the 3 Oct snapshot date, not a landing date.</p></div>`;
}
function moduleMid(m,r){
  const inside=id=>modOf(id)===m.id, cross=D.edges.filter(e=>inside(e.from)!==inside(e.to));
  const by={};for(const e of cross){const o=modOf(inside(e.from)?e.to:e.from);(by[o]??=[]).push(e)}
  const ws=[...new Set(m.places.flatMap(p=>workAt[p]||[]))];
  return `<div class="mid">
    <div class="blk"><h4>How it works</h4>${m.body.map(l=>`<p>${esc(l)}</p>`).join('')}</div>
    <div class="blk"><h4>Places<small>${m.places.length}</small></h4>${placeList(m.places,r)}</div>
    <div class="blk"><h4>Connections with other modules<small>${cross.length}</small></h4>${Object.entries(by).map(([o,es])=>`<p class="note" style="margin-top:8px"><b><a href="#module/${o}">${esc(M[o].title)}</a></b> · ${es.length}</p>${edgeRows(es,r)}`).join('')}</div>
    <div class="blk"><h4>Work that touches this module<small>${ws.length}</small></h4><div class="inl">${ws.map(w=>`<a href="#work/${w}" data-key="go:${w}">${esc(W[w].code)} · ${esc(W[w].title)}</a>`).join('')}</div></div></div>`;
}
let query='';
const match=(...s)=>!query||s.join(' ').toLowerCase().includes(query);
function sections(r){
  const t=tabOf(r);
  if(t==='work') return GROUPS.map(([g,name,hint])=>{const ws=D.work.filter(w=>w.group===g&&(match(w.code,w.title,w.purpose,w.scope,...w.touches.map(nodeTitle))||workOf(r)===w.id));if(!ws.length)return '';
    return `<section class="sec"><div class="sec-h"><h2>${name}<small>${ws.length}</small></h2><span>${hint}</span></div>${ws.map(w=>{const open=workOf(r)===w.id;
      return `<div class="entry${open?' open':''}">${row('work:'+w.id,open?'#plant/work':'#work/'+w.id,open,'Feature',esc(w.title)+tag(w),esc(w.purpose),`${esc(w.date)} · ${esc(w.code)} · ${esc(w.scope)} · ${w.touches.length} ${w.touches.length===1?'place':'places'}`,w.touches)}${open?workMid(w,r):''}</div>`}).join('')}</section>`}).join('');
  if(t==='journeys'){const js=D.journeys.filter(j=>match(j.title,j.purpose)||r.id===j.id);
    return `<section class="sec"><div class="sec-h"><h2>Journeys<small>${js.length}</small></h2><span>Ordered steps through the plant</span></div>${js.map(j=>{const open=r.view==='journey'&&r.id===j.id;const ps=[...new Set(j.steps.map(s=>s.place))];
      return `<div class="entry${open?' open':''}">${row('journey:'+j.id,open?'#plant/journeys':'#journey/'+j.id,open,'Journey',esc(j.title)+tag(j),esc(j.purpose),`${j.steps.length} steps · ${ps.length} places`,ps)}${open?journeyMid(j,r):''}</div>`}).join('')}</section>`}
  if(t==='days'){const ds=D.days.filter(d=>match(d.title,d.purpose)||r.id===d.id);
    return `<section class="sec"><div class="sec-h"><h2>Days<small>${ds.length}</small></h2><span>What changed, by date</span></div>${ds.map(d=>{const open=r.view==='day'&&r.id===d.id;const ps=[...new Set(d.items.flatMap(i=>W[i.work].touches))];
      const tags=d.items.map(i=>W[i.work]).filter(w=>w.signal&&w.signal!=='changed').map(tag).join('');
      return `<div class="entry${open?' open':''}">${row('day:'+d.id,open?'#plant/days':'#day/'+d.id,open,'Day',esc(d.title)+tags,esc(d.purpose),`${d.items.length} entries · ${d.items.map(i=>W[i.work].code).join(' · ')}`,ps)}${open?dayMid(d):''}</div>`}).join('')}</section>`}
  return D.modules.map(m=>{const ps=m.places.filter(p=>match(P[p].title,P[p].gloss)||r.id===p);if(!ps.length&&!match(m.title))return '';
    const mopen=r.view==='module'&&r.id===m.id;const single=m.places.length===1&&m.places[0]===m.id;
    return `<section class="sec"><div class="sec-h"><h2>${esc(m.title)}<small>${m.places.length}</small></h2><span><a href="${mopen?'#plant/places':'#module/'+m.id}">${mopen?'Close module':'Open module'}</a></span></div>
      ${mopen?`<div class="entry open">${row('module:'+m.id,'#plant/places',true,'Module',esc(m.title),esc(m.gloss),`${m.places.length} places · ${D.edges.filter(e=>(modOf(e.from)===m.id)!==(modOf(e.to)===m.id)).length} cross-module connections`,m.places)}${moduleMid(m,r)}</div>`:''}
      ${ps.filter(()=>!mopen||!single).map(p=>{const open=r.view==='place'&&!r.via&&r.id===p;const x=P[p];
        return `<div class="entry${open?' open':''}">${row('place:'+p,open?'#plant/places':'#place/'+p,open,'Place',esc(x.title)+(x.status==='partial'?'<span class="tag partial">Partial</span>':''),esc(x.gloss),`${(workAt[p]||[]).length} work · ${(jAt[p]||[]).length} journeys · ${edgesAt(p).length} connections`,[p],true)}${open?`<div class="mid">${placeBody(p,r,false)}</div>`:''}</div>`}).join('')}</section>`}).join('');
}
const cut=(s,n)=>s.length>n?s.slice(0,n-1).trimEnd()+'…':s;
function crumbs(r){
  const t=tabOf(r), tabName=TABS.find(x=>x[0]===t)[1];
  const c=[`<a href="#plant/${t}">Plant</a>`];
  if(r.view!=='plant') c.push(`<a href="#plant/${t}">${tabName}</a>`); else c.push(`<b>${tabName}</b>`);
  const w=workOf(r);
  if(w){const x=W[w];const deeper=r.ev!==null&&r.ev!==undefined||r.view==='place';c.push(deeper?`<a href="#work/${w}">${esc(x.code)} · ${esc(cut(x.title,18))}</a>`:`<b>${esc(x.code)} · ${esc(cut(x.title,40))}</b>`);
    if(r.view==='work'&&r.ev!==null) c.push(`<b>Evidence: ${esc(x.evidence[r.ev].title)}</b>`);
    if(r.view==='place') c.push(`<b>Place: ${esc(P[r.id].title)}</b>`)}
  if(r.view==='place'&&!r.via){c.push(`<a href="#module/${P[r.id].module}">${esc(M[P[r.id].module].title)}</a>`);c.push(`<b>${esc(P[r.id].title)}</b>`)}
  if(r.view==='module') c.push(`<b>Module: ${esc(M[r.id].title)}</b>`);
  if(r.view==='journey'){const j=J[r.id];c.push(r.step?`<a href="#journey/${j.id}">${esc(cut(j.title,26))}</a>`:`<b>${esc(j.title)}</b>`);if(r.step)c.push(`<b>Step ${r.step}: ${esc(P[j.steps[r.step-1].place].title)}</b>`)}
  if(r.view==='day') c.push(`<b>${esc(Y[r.id].title)}</b>`);
  const up=parentHref(r), upName=r.view==='plant'?null:(()=>{const q=parse(up);if(q.view==='plant')return TABS.find(x=>x[0]===q.tab)[1];if(q.view==='work')return W[q.id].code+' detail';if(q.view==='journey')return 'all steps';return 'list'})();
  return `<nav class="crumbs" aria-label="Where you are"><div class="trail"><span class="lbl">Where you are</span>${c.join('<span class="sep">/</span>')}</div>${upName?`<a class="up" href="${up}" title="Esc">← Back to ${esc(upName)}</a>`:''}</nav>`;
}
function renderRead(r){
  const t=tabOf(r);
  document.getElementById('read').innerHTML=crumbs(r)+
    `<div class="tools"><nav class="tabs" aria-label="Lists">${TABS.map(([k,n,c])=>`<a href="#plant/${k}" aria-current="${k===t?'page':'false'}">${n}<small>${c}</small></a>`).join('')}</nav><input class="filter" id="filter" type="search" placeholder="Filter ( / )" value="${esc(query)}" aria-label="Filter this list"></div>`+
    (r.view==='plant'?`<p class="hint">${t==='places'?'Every place in the plant, by module. Open one to see its connections and the work that names it.':t==='journeys'?'Open a journey to number its steps in the plant.':t==='days'?'Open a day to light what changed in the plant.':'Open work for its reason. The plant lights the places it touches. Esc goes back one step.'}</p>`:'')+
    (sections(r)||'<p class="empty">Nothing matches this filter.</p>')+
    `<p class="foot">Design sample for Adam, 5 Oct. Places, connections, features, and journeys come from the local map snapshot ${D.plant.revision} (3 Oct). Signals and days come from tickets and the board. Nothing here is live state.</p>`;
  const f=document.getElementById('filter');
  f.addEventListener('input',()=>{query=f.value.trim().toLowerCase();const pos=f.selectionStart;renderRead(route);applyAtlas(route);const g=document.getElementById('filter');g.focus();g.setSelectionRange(pos,pos)});
}

/* Navigation: keep the clicked element still; going up keeps the deepest open item still, or reveals its row. */
let route=parse(location.hash), anchor=null;
const headH=()=>{const m=document.getElementById('mast');return (getComputedStyle(m).position==='sticky'?m.offsetHeight:0)+document.querySelector('#read .crumbs').offsetHeight};
function reveal(el){window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+window.scrollY-headH()-10)})}
function upAnchor(){
  const row=document.querySelector('#read .entry.open>.row');
  const k=(document.querySelector('#read .evl[aria-expanded="true"],#read .pl.cur,#read .steps a[aria-current="step"]')||row)?.closest('[data-key]');
  if(!k) return null;
  const t=k.getBoundingClientRect().top;
  return t>headH()?{key:k.dataset.key,top:t,row:row?.dataset.key}:{key:(row||k).dataset.key,reveal:true};
}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;
  const k=a.closest('[data-key]');
  anchor=a.closest('.crumbs,.deep .back')?upAnchor():a.closest('#read')&&k?{key:k.dataset.key,top:k.getBoundingClientRect().top}:null;
  if(a.getAttribute('href')===location.hash){e.preventDefault();go()}},true);
function go(){
  route=parse(location.hash);
  renderMast(route);renderRead(route);applyAtlas(route);
  const find=key=>key&&document.querySelector(`#read [data-key="${CSS.escape(key)}"]`);
  const el=anchor&&find(anchor.key);
  if(el&&!anchor.reveal) window.scrollBy(0,el.getBoundingClientRect().top-anchor.top);
  else{const tgt=el||(anchor&&find(anchor.row))||document.getElementById('deep')||document.querySelector('#read .entry.open');
    if(tgt) reveal(tgt); else if(route.view==='plant') window.scrollTo({top:0})}
  anchor=null;
}
window.addEventListener('hashchange',go);
document.addEventListener('keydown',e=>{
  if(e.target instanceof HTMLInputElement){if(e.key==='Escape'){e.target.blur()}return}
  if(e.key==='Escape'&&route.view!=='plant'){anchor=upAnchor();location.hash=parentHref(route)}
  if(e.key==='/'){e.preventDefault();document.getElementById('filter').focus()}
});
/* Hover links: preview lighting from rows, mark one wire or place from detail links. */
document.addEventListener('mouseover',e=>{
  const atlas=document.getElementById('atlas');
  const rw=e.target.closest('#read .row[data-places]');
  atlas.classList.toggle('preview',!!rw&&rw.getAttribute('aria-expanded')!=='true');
  stage.querySelectorAll('.place.pv').forEach(x=>x.classList.remove('pv'));
  if(rw&&rw.getAttribute('aria-expanded')!=='true') rw.dataset.places.split(' ').forEach(id=>stage.querySelector(`.place[data-place="${CSS.escape(id)}"]`)?.classList.add('pv'));
  stage.querySelectorAll('.place.hov').forEach(x=>x.classList.remove('hov'));
  const h=e.target.closest('#read [data-hover]');if(h) stage.querySelector(`.place[data-place="${CSS.escape(h.dataset.hover)}"]`)?.classList.add('hov');
  document.querySelectorAll('#over .wire.hot').forEach(x=>x.classList.remove('hot'));
  const er=e.target.closest('#read [data-wire]');if(er){const [f,t]=er.dataset.wire.split('|');document.querySelector(`#over .wire[data-from="${CSS.escape(f)}"][data-to="${CSS.escape(t)}"]`)?.classList.add('hot')}
});
buildAtlas();go();
new ResizeObserver(()=>drawWires()).observe(stage);
</script>
</body>
</html>
