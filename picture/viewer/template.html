<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Architecture map</title>
<!-- ARCHMAP:CSS -->
</head>
<body>
<header class="top">
  <nav class="crumbs" id="crumbs" aria-label="Level"></nav>
  <div class="project-state" id="project-state" aria-label="Picture revision"></div>
  <div class="search">
    <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Search  /" aria-label="Search blocks" role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
    <ul id="search-results" class="results" role="listbox" aria-label="Search results" hidden></ul>
  </div>
  <button type="button" id="diag-toggle" class="tbtn" aria-expanded="false" aria-controls="drawer">Diagnostics</button>
  <button type="button" id="panel-toggle" class="tbtn" aria-expanded="true" aria-controls="panel">Details</button>
</header>
<main class="main" id="main">
  <section class="stage" aria-labelledby="level-title">
    <div class="level-head" id="level-head"></div>
    <div class="legend" id="legend"></div>
    <div class="viewport" id="viewport">
      <div class="sizer" id="sizer">
        <div class="canvas" id="canvas">
          <svg class="edges" id="edges" aria-hidden="true"></svg>
          <div class="blocks" id="blocks" role="group" aria-label="Blocks"></div>
        </div>
      </div>
    </div>
  </section>
  <aside class="panel" id="panel" aria-label="Details"><div class="panel-body" id="panel-body"></div></aside>
</main>
<section class="drawer" id="drawer" aria-label="Diagnostics" hidden></section>
<div class="tip" id="tip" role="tooltip" hidden></div>
<noscript><p class="noscript">This map needs JavaScript.</p></noscript>
<!-- ARCHMAP:DATA -->
<!-- ARCHMAP:JS -->
</body>
</html>
